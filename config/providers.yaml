# Single source of truth for provider capabilities. Runtime, docs, and any
# future IDE integration should all read this instead of each guessing
# independently — that kind of drift (README vs VSCode defaults vs
# IntelliJ notes vs actual config.yaml all disagreeing) is exactly what we
# found in QonQrete v1.

providers:
  mock:
    kind: cli
    status: implemented
    supports_sessions: false
    supports_interactive_tui: false
    supports_exec_mode: true
    supports_tools: true
    supports_thinking_mode: false
    default_model: mock
    models:
      - mock
    notes: "Offline test adapter — zero API calls. Use with --dry-run."

  codeseeq:
    kind: cli
    status: implemented
    supports_sessions: true
    supports_interactive_tui: true   # exists upstream, deliberately unused — see qq/adapters/parameters.py
    supports_exec_mode: true
    supports_tools: true
    supports_thinking_mode: true
    default_model: deepseek-v4-flash
    models:
      - deepseek-v4-flash
      - deepseek-v4-flash-thinking
      - deepseek-v4-pro
      - deepseek-v4-pro-thinking
    repo: https://github.com/illdynamics/codeseeq

  chatgpt:
    kind: cli
    status: implemented
    supports_sessions: true
    supports_interactive_tui: true
    supports_exec_mode: true
    supports_tools: true
    supports_thinking_mode: true
    default_model: gpt-5.5
    models:
      - gpt-5.5-pro
      - gpt-5.5
      - gpt-5.4-mini
      - gpt-5.4-nano
    repo: https://github.com/illdynamics/codeseeq
    notes: "Native ChatGPT account sign-in through the system codeseeq CLI. No API key — QonQrete triggers `codeseeq login` automatically on the first run (interactive terminal) when no sign-in exists yet; choose 'Sign in with ChatGPT'. Every agent reuses that session."

  jamini:
    kind: cli
    status: stub
    notes: "Intended Gemini-backed sibling to codeseeq. Wire up the same way (qq/adapters/parameters.py is the pattern)."

  jeanclaude:
    kind: cli
    status: stub
    notes: "Intended Claude-Code-backed sibling. Same pattern."

  codex:
    kind: cli
    status: stub
    notes: "Raw upstream Codex CLI, for people without a DeepSeek key."

  gemini-cli:
    kind: cli
    status: stub

  claude-code:
    kind: cli
    status: stub

  llama-cpp:
    kind: api
    status: implemented
    supports_sessions: false
    supports_interactive_tui: false
    supports_exec_mode: true
    supports_tools: false
    supports_thinking_mode: false
    default_model: local
    models: []
    notes: >
      OpenAI-compatible local inference via llama.cpp server (or any compat endpoint).
      No model name is sent — the server uses whatever model is currently loaded.
      Endpoint: http://127.0.0.1:8888/v1 (override with QQ_LLAMA_CPP_ENDPOINT).
      No API key required for local servers (set QQ_LLAMA_CPP_API_KEY for proxied setups).
      Windows + WSL2: qq auto-detects a llama-server that runs on the Windows host
      through the WSL NAT gateway, but the Windows server must listen on all
      interfaces (llama-server ... --host 0.0.0.0 --port 8888). Running llama-server
      inside WSL is the zero-config option (127.0.0.1 works and Windows reaches it via
      localhost:8888). QQ_WSL_HOST_IP can seed/override the detected Windows-host IP.
