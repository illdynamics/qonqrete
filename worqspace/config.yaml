# QonQrete Configuration
# ========================

agents:
  instruqtor:
    provider: qwen
    model: qwen-turbo

  calqulator:
    provider: local
    model: calqulator

  construqtor:
    provider: gemini
    model: gemini-2.5-flash-lite

  inspeqtor:
    provider: openai
    model: gpt-4.1-nano

  qontextor:
    provider: local
    model: qontextor
    # local_mode: 'fast' = AST-only analysis
    #             'complex' = AST + deep semantic analysis (requires sentence-transformers)
    local_mode: complex
    # To use an AI provider for qontextor, change provider and model, e.g.:
    # provider: gemini
    # model: gemini-2.5-flash-lite

  qompressor:
    provider: local
    model: qompressor

options:
  # ========================
  # Agent Enable/Disable
  # ========================
  
  # Enable/disable Qompressor (skeleton generation)
  # true = Generate bloq.d skeletons for AI context (default)
  # false = Send full codebase to AI agents (more tokens, better context)
  use_qompressor: true
  
  # Enable/disable Qontextor (context indexing)
  # true = Generate qontext.d semantic maps (default)
  # false = Skip context generation entirely
  use_qontextor: true

  # ========================
  # Cheqpoint Configuration
  # ========================
  
  # true = User-gated mode by default (cheqpoints enabled).
  # false = Autonomous mode by default (cheqpoints disabled).
  cheqpoint: false

  # Max number of cycles to run in auto-mode.
  auto_cycle_limit: 4

  # ========================
  # Generation Settings
  # ========================
  
  # Briq Granularity Control (0-9)
  # 0 = Atomic (Every bullet is a file)
  # 5 = Balanced
  # 9 = Monolithic (Whole task is one file)
  briq_sensitivity: 6

  # Operational Mode
  # Options: program, enterprise, performance, security, innovative, balanced
  mode: program
