# QonQrete Configuration v1.0.4-stable
# ═══════════════════════════════════════════════════════════════════════════════
#
# v1.0.2 NEW: INVERTED BRIQ SENSITIVITY SCALE!
# Higher number = MORE briqs (more intuitive!)
#
# BRIQ SENSITIVITY SCALE (0-16):
#   0  = Monolithic (1 briq)         - Single giant briq
#   1  = Very Broad (2-3 briqs)      - Major chunks only
#   2  = Broad (3-5 briqs)           - Large components
#   3  = Feature-level (5-8 briqs)   - Per-feature
#   4  = Component-level (8-12)      - Per-component
#   5  = Balanced (10-15 briqs)      ← RECOMMENDED DEFAULT
#   6  = Standard (15-20 briqs)      - Most files separate
#   7  = High (20-30 briqs)          - Detailed split
#   8  = Very High (30-40 briqs)     - Fine-grained
#   9  = Atomic (40-60 briqs)        - Maximum detail
#  10  = Ultra (50-75 briqs)         - Enterprise projects
#  11  = Mega (60-90 briqs)          - Large enterprise
#  12  = Hyper (75-110 briqs)        - Complex architectures
#  13  = Extreme (90-130 briqs)      - Multi-layer systems
#  14  = Maximum (110-160 briqs)     - Critical systems
#  15  = Insane (130-200 briqs)      - Mega specifications
#  16  = QONQRETE MAX (160-250)      - Enterprise mega-tasqs!
#
# v1.0.2 NEW: Non-interactive qonstruction save with -n flag
# v1.0.2 NEW: Qontrabender only active when using Gemini for construqtor
#
# ═══════════════════════════════════════════════════════════════════════════════

# ═══════════════════════════════════════════════════════════════════════════════
# RETRY CONFIGURATION (v0.8.2+)
# ═══════════════════════════════════════════════════════════════════════════════
retry:
  # Enable/disable retry mechanism
  enabled: true
  
  # Maximum attempts per briq (1 = no retry, 3 = 2 retries)
  max_attempts: 3
  
  # Stop entire cycle if a briq fails after all retries?
  # true = stop immediately on briq failure (fail-fast)
  # false = continue to next briq, collect all failures (fail-tolerant)
  stop_on_briq_fail: false
  
  # Delay between retries (seconds)
  retry_delay: 2

repair:
  # Maximum same-run bounded repair passes after inspection emits repair intent.
  max_attempts: 2

ai_budgeting:
  dry_run_provider: deepseek
  enable_no_loss_chunking: true
  summarize_optional_sections: true
  include_previous_log: true
  previous_log_max_chars: 12000
  max_preload_chunks_per_request: 24
  chunk_target_input_tokens: 12000
  audit_dir: audit/ai_payloads
  task_output_tokens:
    code_generation: 6000
    review: 2000
    planning: 2500
  agent_output_tokens:
    construqtor: 6000
    inspeqtor: 2000
    instruqtor: 2500
  providers:
    deepseek:
      defaults:
        safe_input_tokens: 32000
        safe_output_tokens: 8000
        total_context_window: 48000
        chars_per_token: 4.0
        supports_multi_message_history: true
        supports_chunk_preload: true
        supports_system_messages: true
    gemini:
      defaults:
        safe_input_tokens: 80000
        safe_output_tokens: 8192
        total_context_window: 100000
        chars_per_token: 4.0
        supports_multi_message_history: true
        supports_chunk_preload: true
        supports_system_messages: true
    anthropic:
      defaults:
        safe_input_tokens: 80000
        safe_output_tokens: 8192
        total_context_window: 100000
        chars_per_token: 3.5
        supports_multi_message_history: true
        supports_chunk_preload: true
        supports_system_messages: true

# ═══════════════════════════════════════════════════════════════════════════════
# INTERLEAVED PIPELINE (NEW in v0.8.3)
# ═══════════════════════════════════════════════════════════════════════════════
# Build → Review → Build → Review (per briq)
interleaved:
  # Enable interleaved build + review per briq
  enabled: true
  
  # Run local validation after each briq (syntax, imports) - NO AI
  local_validation: true
  
  # Run lightweight AI review after each briq
  # Set to false for faster builds, true for better quality assurance
  ai_quick_review: false
  
  # Retry briq build if AI review fails
  retry_on_review_fail: true

# ═══════════════════════════════════════════════════════════════════════════════
# LOCAL VERIFICATION (v0.8.2+)
# ═══════════════════════════════════════════════════════════════════════════════
verification:
  # Enable local verification after all briqs complete
  enabled: true
  
  # What to check
  checks:
    syntax: true              # Python syntax validation (compile())
    imports: true             # Check if imports resolve to files
    skeleton_match: true      # Compare expected vs actual function signatures

agents:
  # ═══════════════════════════════════════════════════════════════════════════
  # QRYSTALLIZER - Canonical intake / clarification
  # Legacy `tasqleveler` remains a compatibility alias only.
  # ═══════════════════════════════════════════════════════════════════════════
  qrystallizer:
    provider: deepseek
    model: deepseek-chat
    timeout: 600
    # Transitional compatibility knobs retained for the wrapper path.
    enabled: true
    min_complexity_score: 200  # Below this score, don't enhance
    min_lines: 200             # Below this line count, don't enhance

  guard:
    provider: deepseek
    model: deepseek-chat
    timeout: 600

  # ═══════════════════════════════════════════════════════════════════════════
  # INSTRUQTOR - Briq Planning
  # ═══════════════════════════════════════════════════════════════════════════
  instruqtor:
    provider: deepseek
    model: deepseek-chat
    timeout: 600

  calqulator:
    provider: local
    model: calqulator

  # ═══════════════════════════════════════════════════════════════════════════
  # CONSTRUQTOR - Code Generation (needs smarter model)
  # ═══════════════════════════════════════════════════════════════════════════
  construqtor:
    provider: deepseek
    model: deepseek-chat
    timeout: 600

  # ═══════════════════════════════════════════════════════════════════════════
  # INSPEQTOR - Code Review (v0.8.8 Batched Mode)
  # ═══════════════════════════════════════════════════════════════════════════
  inspeqtor:
    provider: deepseek
    model: deepseek-chat
    timeout: 600
    
    # BATCHED REVIEW MODE (v0.8.6+) - 90% fewer API calls!
    batch_mode: true                 # Group briqs into batches
    batch_token_roof: 60000          # Max input tokens per batch (~240KB)
    batch_max_briqs: 12              # Max briqs per batch (safety cap)
    
    # Legacy per-briq limits (used when batch_mode=false)
    max_prompt_chars_per_briq: 500000
    max_context_files_per_briq: 40
    max_chars_per_context_file: 80000
    
    # Context filtering
    use_filtered_context: true
    include_neighbor_depth: 1

  qontextor:
    provider: local
    model: qontextor
    # local_mode: 'fast' = AST-only analysis
    #             'complex' = AST + deep semantic analysis
    local_mode: complex

  qompressor:
    provider: local
    model: qompressor

  qontrabender:
    # NOTE: Qontrabender is ONLY active when construqtor uses Gemini!
    # It's specifically designed for Gemini's context caching feature.
    provider: local
    model: qontrabender
    
    # ═══════════════════════════════════════════════════════════════════════════
    # POLICY-DRIVEN CONFIGURATION (v0.8.0)
    # ═══════════════════════════════════════════════════════════════════════════
    
    # Path to caching policy file (relative to worqspace)
    policy_file: "./caching_policy.yaml"
    
    # Select operational mode from caching_policy.yaml
    # Available modes:
    #   - local_fast:       Ultra-fast, skeleton only, no remote cache
    #   - local_smart:      Default - variable fidelity, local only (RECOMMENDED)
    #   - cyber_bedrock:    Remote cache for stable bedrock
    #   - cyber_aggressive: Aggressive remote caching, more churn
    #   - paranoid_mincloud: Minimal cloud exposure, skeletons only
    #   - debug_repro:      Maximum audit logging for debugging
    mode: local_smart

options:
  # ═══════════════════════════════════════════════════════════════════════════
  # Agent Enable/Disable
  # ═══════════════════════════════════════════════════════════════════════════
  
  # Enable/disable Qompressor (skeleton generation)
  use_qompressor: true
  
  # Enable/disable Qontextor (context indexing)
  use_qontextor: true

  # Enable/disable Qontrabender (hybrid caching with policy-driven fidelity)
  # NOTE: Only works when construqtor.provider is 'gemini'!
  use_qontrabender: true

  # ═══════════════════════════════════════════════════════════════════════════
  # Cheqpoint Configuration
  # ═══════════════════════════════════════════════════════════════════════════
  
  # true = User-gated mode (cheqpoints enabled)
  # false = Autonomous mode (cheqpoints disabled)
  cheqpoint: false

  # Max cycles in auto-mode.
  # Runtime semantics note: 0 is effectively unlimited because qrane only
  # stops on the cycle cap when max_cycles > 0. This pass uses 12 explicitly
  # to keep continuation bounded during the live proof run.
  auto_cycle_limit: 12

  # ═══════════════════════════════════════════════════════════════════════════
  # Cost Confirmation Gate (GateQeeper)
  # ═══════════════════════════════════════════════════════════════════════════
  
  # When true, after CalQulator estimates the run cost, QonQrete will prompt
  # you to confirm before proceeding. You must answer yes/no.
  # When false (default), runs proceed without cost confirmation.
  cost_confirmation_gate: false

  # ═══════════════════════════════════════════════════════════════════════════
  # Generation Settings (v1.0.2 - INVERTED ENFORCED Briq Ranges)
  # ═══════════════════════════════════════════════════════════════════════════
  
  # Briq Granularity Control (0-16) - INVERTED & ENFORCED!
  # v1.0.2: Higher number = MORE briqs! (more intuitive)
  #
  # SENSITIVITY SCALE:
  #   0  = Monolithic    (exactly 1 briq)
  #   1  = Very Broad    (2-3 briqs)
  #   2  = Broad         (3-5 briqs)
  #   3  = Feature-level (5-8 briqs)
  #   4  = Component     (8-12 briqs)
  #   5  = Balanced      (10-15 briqs)  ← RECOMMENDED DEFAULT
  #   6  = Standard      (15-20 briqs)
  #   7  = High Gran.    (20-30 briqs)
  #   8  = Very High     (30-40 briqs)
  #   9  = Atomic        (40-60 briqs)
  #  10  = Ultra         (50-75 briqs)
  #  11  = Mega          (60-90 briqs)
  #  12  = Hyper         (75-110 briqs)
  #  13  = Extreme       (90-130 briqs)
  #  14  = Maximum       (110-160 briqs)
  #  15  = Insane        (130-200 briqs)
  #  16  = QONQRETE MAX  (160-250 briqs)
  #
  # RECOMMENDATIONS:
  #   Simple projects (web server, API): sens=1-2, cycles=1-3
  #   Medium projects (full-stack app):  sens=4-6, cycles=2-4
  #   Complexer projects (multi-service):  sens=6-10, cycles=3-6
  #   QonQrete exQavator sized projects: sens=10+, cycles=6+
  briq_sensitivity: 1

  # Operational Mode
  mode: program
