# QonQrete Configuration v1.2.2-stable
# ═══════════════════════════════════════════════════════════════════════════════
#
# v1.2.2 alignment:
# - single-image runtime remains
# - Qrystallizer handles requirement anchoring in qrystal.d/
# - Qualifier is the single source of truth for execution validation
# - cycles=0 means auto (with auto_cycle_limit as the hard safety cap)
# - provider: local and provider: llamacpp are NOT the same thing
#
# CORE COMPLETION PATH
#   Qrystallizer → InstruQtor → ConstruQtor → Qualifier → InspeQtor → Qrane
#
# SUPPORT PASSES MAY ALSO RUN
#   CalQulator / Qontextor / Qompressor / Qontrabender
#
# SENSITIVITY SCALE (0-16):
#   0  = Monolithic (1 briq)
#   5  = Balanced (10-15 briqs)      ← RECOMMENDED DEFAULT
#   16 = QONQRETE MAX (160-250)
#
# ═══════════════════════════════════════════════════════════════════════════════

agents:
  # Qrystallizer: preflight analysis, requirement anchoring, anti-drift.
  # Runs on Cycle 1 and writes qrystal.d/ artifacts.
  qrystallizer:
    provider: openai
    model: gpt-4o
    enabled: true

  # InstruQtor: task decomposition into atomic briqs.
  # program = only MANDATORY briqs from the canonical ledger.
  # innovative = mandatory briqs first, optional enhancement briqs separated via Scope-Class.
  instruqtor:
    provider: openai
    model: gpt-4o
    timeout: 300

  # ConstruQtor: code generation only.
  # Writes source into qodeyard/ and change summaries into exeq.d/.
  # No build/test/runtime validation happens here.
  construqtor:
    provider: gemini
    model: gemini-1.5-pro
    timeout: 300

  # Qualifier: ALL deterministic validation and execution checks live here.
  # Runs builtin checks first, then configured command checks.
  # Writes cycle-scoped machine-readable evidence into quality.d/.
  qualifier:
    provider: local
    model: qualifier
    enabled: true
    command_timeout: 300
    commands:
      - name: builtin_suite
        type: builtin
        enabled: true
      - name: pytest
        type: shell
        cmd: pytest -v qodeyard/
        enabled: false
      - name: build
        type: shell
        cmd: echo "No build required"
        enabled: false

  # InspeQtor: evaluation and verdict synthesis.
  # Reads code changes, quality.d/, and guard/requirement coverage.
  # Writes reqap markdown plus structured verdict JSON in reqap.d/.
  inspeqtor:
    provider: openai
    model: gpt-4o
    timeout: 300
    batch_mode: true
    batch_token_roof: 60000
    batch_max_briqs: 12

  # Support agents / utilities
  qontextor:
    provider: local
    model: qontextor
  qompressor:
    provider: local
    model: qompressor
  qontrabender:
    provider: local
    model: qontrabender

options:
  # Operational mode
  #   program:    freeze execution scope to the explicit tasq + canonical requirement ledger (default)
  #   innovative: finish canonical ledger work first, then keep extras in an optional enhancement backlog
  # Runtime briqs persist this split with Scope-Class: MANDATORY vs OPTIONAL_ENHANCEMENT.
  mode: program

  # Cycle control
  #   0  = auto (Qrane stops from structured verdict artifacts)
  #   >0 = fixed manual cycle cap
  # auto_cycle_limit is ONLY the hard safety cap for auto mode.
  auto_cycle_limit: 4

  # Granularity (0-16): higher = more briqs
  briq_sensitivity: 5

  # Enable/disable support agents
  use_qompressor: true
  use_qontextor: true
  use_qontrabender: true

# Provider configuration
# - local: internal Python worker agent inside the QonQrete runtime
# - llamacpp: external OpenAI-compatible HTTP endpoint for LLM inference
providers:
  local:
    enabled: true

  llamacpp:
    enabled: false
    endpoint: "http://host.docker.internal:8080/v1"
    api_key: "not-needed-for-local"

retry:
  enabled: true
  max_attempts: 3
  stop_on_briq_fail: false
  retry_delay: 2
