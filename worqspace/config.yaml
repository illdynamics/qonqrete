# QonQrete Configuration v1.7.8-stable
# ═══════════════════════════════════════════════════════════════════════════════
# NEW in v1.7.8: ALL LOCAL BY DEFAULT! 🆓🔥
# - LocalInstruQtor: instruqtor.provider = 'local' (FREE task splitting)
# - MindstaQ: construqtor.provider = 'local' (FREE code generation)
# - LocalInspeQtor: inspeqtor.provider = 'local' (FREE code review)
# - briq_sensitivity: 3 (Standard: 15-20 briqs)
# - auto_cycle_limit: 6 (Optimal for complex projects)
# 
# NOTE: When using local construqtor, qontrabender and calqulator are auto-skipped
# ═══════════════════════════════════════════════════════════════════════════════

# ═══════════════════════════════════════════════════════════════════════════════
# RETRY CONFIGURATION (v0.8.2+)
# ═══════════════════════════════════════════════════════════════════════════════
retry:
  # Enable/disable retry mechanism
  enabled: true
  
  # Maximum attempts per briq (1 = no retry, 3 = 2 retries)
  max_attempts: 3
  
  # Stop entire cycle if a briq fails after all retries?
  # true = stop immediately on briq failure (fail-fast)
  # false = continue to next briq, collect all failures (fail-tolerant)
  stop_on_briq_fail: false
  
  # Delay between retries (seconds)
  retry_delay: 2

# ═══════════════════════════════════════════════════════════════════════════════
# INTERLEAVED PIPELINE (NEW in v0.8.3)
# ═══════════════════════════════════════════════════════════════════════════════
# Build → Review → Build → Review (per briq)
interleaved:
  # Enable interleaved build + review per briq
  enabled: true
  
  # Run local validation after each briq (syntax, imports) - NO AI
  local_validation: true
  
  # Run lightweight AI review after each briq
  # Set to false for faster builds, true for better quality assurance
  ai_quick_review: false
  
  # Retry briq build if AI review fails
  retry_on_review_fail: true

# ═══════════════════════════════════════════════════════════════════════════════
# LOCAL VERIFICATION (v0.8.2+)
# ═══════════════════════════════════════════════════════════════════════════════
verification:
  # Enable local verification after all briqs complete
  enabled: true
  
  # What to check
  checks:
    syntax: true              # Python syntax validation (compile())
    imports: true             # Check if imports resolve to files
    skeleton_match: true      # Compare expected vs actual function signatures

agents:
  # ═══════════════════════════════════════════════════════════════════════════
  # TASQLEVELER - Task Enhancement (v1.2.0: Now supports LocalTasqLeveler!)
  # ═══════════════════════════════════════════════════════════════════════════
  # tasqleveler:
  #   # PROVIDER OPTIONS:
  #   # ├─ local + model: tasqleveler  ← FREE FOREVER! Pattern-based enhancement
  #   # ├─ openai                      ← GPT-4 (default)
  #   # ├─ anthropic                   ← Claude
  #   # └─ gemini                      ← Google Gemini
  #   provider: local        # ← Uncomment to enable LocalTasqLeveler
  #   model: tasqleveler     # ← Only enhances tasks above threshold size
  #   # THRESHOLD CONFIG (optional, v1.2.1 defaults):
  #   # min_chars: 100       # Minimum chars to trigger enhancement
  #   # min_lines: 5         # Minimum lines to trigger enhancement
  #   # min_sections: 2      # Minimum sections to trigger enhancement

  # ═══════════════════════════════════════════════════════════════════════════
  # INSTRUQTOR - Briq Planning (v1.1.2: Now supports LocalInstruQtor!)
  # ═══════════════════════════════════════════════════════════════════════════
  instruqtor:
    # PROVIDER OPTIONS:
    # ├─ local + model: instruqtor  ← FREE FOREVER! Pattern-based task splitting
    # ├─ openai                     ← GPT-4 (default)
    # ├─ anthropic                  ← Claude
    # ├─ gemini                     ← Google Gemini
    # └─ deepseek                   ← Cheap cloud option
    provider: local        # v1.7.8: LOCAL BY DEFAULT!
    model: instruqtor      # LocalInstruQtor: splits by paragraphs, bullets, sections
    # provider: openai     # ← Uncomment for cloud mode
    # model: gpt-4.1-nano  # $0.10/$0.40 per 1M - cheap & smart enough

  calqulator:
    provider: local
    model: calqulator
    # NOTE: Calqulator is auto-skipped when construqtor.provider is 'local'

  # ═══════════════════════════════════════════════════════════════════════════
  # CONSTRUQTOR - Code Generation (v1.2.0: Now supports mindstaQ!)
  # ═══════════════════════════════════════════════════════════════════════════
  construqtor:
    # PROVIDER OPTIONS:
    # ├─ local + model: mindstaq  ← FREE FOREVER! No LLM, symbolic reasoning
    # ├─ gemini                   ← Google (current default)
    # ├─ openai                   ← GPT-4
    # ├─ anthropic                ← Claude
    # └─ deepseek                 ← Cheap cloud option
    provider: local        # v1.7.8: LOCAL BY DEFAULT!
    model: mindstaq        # MindstaQ: Zero-LLM code generation engine
    # provider: gemini     # ← Uncomment for cloud mode
    # model: gemini-2.5-flash    # $1.25/$10.00 per 1M - best for code generation

  # ═══════════════════════════════════════════════════════════════════════════
  # INSPEQTOR - Code Review (v1.1.2: Now supports LocalInspeQtor!)
  # ═══════════════════════════════════════════════════════════════════════════
  inspeqtor:
    # PROVIDER OPTIONS:
    # ├─ local + model: inspeqtor  ← FREE FOREVER! AST-based code review
    # ├─ openai                    ← GPT-4 (default)
    # ├─ anthropic                 ← Claude
    # ├─ gemini                    ← Google Gemini
    # └─ deepseek                  ← Cheap cloud option
    provider: local        # v1.7.8: LOCAL BY DEFAULT!
    model: inspeqtor       # LocalInspeQtor: AST + pattern-based review
    # provider: openai     # ← Uncomment for cloud mode
    # model: gpt-4.1-mini  # $0.10/$0.40 per 1M - cheap & smart enough
    
    # BATCHED REVIEW MODE (v0.8.6+) - 90% fewer API calls!
    batch_mode: true                 # Group briqs into batches
    batch_token_roof: 60000          # Max input tokens per batch (~240KB)
    batch_max_briqs: 12              # Max briqs per batch (safety cap)
    
    # Legacy per-briq limits (used when batch_mode=false)
    max_prompt_chars_per_briq: 500000
    max_context_files_per_briq: 40
    max_chars_per_context_file: 80000
    
    # Context filtering
    use_filtered_context: true
    include_neighbor_depth: 1

  qontextor:
    provider: local
    model: qontextor
    # local_mode: 'fast' = AST-only analysis
    #             'complex' = AST + deep semantic analysis
    local_mode: complex

  qompressor:
    provider: local
    model: qompressor

  qontrabender:
    provider: local
    model: qontrabender
    # NOTE: Qontrabender is auto-skipped when construqtor.provider is 'local'
    # (It's specifically for Gemini context caching)
    
    # ═══════════════════════════════════════════════════════════════════════════
    # POLICY-DRIVEN CONFIGURATION (v0.8.0)
    # ═══════════════════════════════════════════════════════════════════════════
    
    # Path to caching policy file (relative to worqspace)
    policy_file: "./caching_policy.yaml"
    
    # Select operational mode from caching_policy.yaml
    # Available modes:
    #   - local_fast:       Ultra-fast, skeleton only, no remote cache
    #   - local_smart:      Default - variable fidelity, local only (RECOMMENDED)
    #   - cyber_bedrock:    Remote cache for stable bedrock
    #   - cyber_aggressive: Aggressive remote caching, more churn
    #   - paranoid_mincloud: Minimal cloud exposure, skeletons only
    #   - debug_repro:      Maximum audit logging for debugging
    mode: local_smart

options:
  # ═══════════════════════════════════════════════════════════════════════════
  # Agent Enable/Disable
  # ═══════════════════════════════════════════════════════════════════════════
  
  # Enable/disable Qompressor (skeleton generation)
  use_qompressor: true
  
  # Enable/disable Qontextor (context indexing)
  use_qontextor: true

  # Enable/disable Qontrabender (hybrid caching with policy-driven fidelity)
  use_qontrabender: true

  # ═══════════════════════════════════════════════════════════════════════════
  # Cheqpoint Configuration
  # ═══════════════════════════════════════════════════════════════════════════
  
  # true = User-gated mode (cheqpoints enabled)
  # false = Autonomous mode (cheqpoints disabled)
  cheqpoint: false

  # Max cycles in auto-mode (recommended: 4 for simple projects, 5-6 for complex)
  auto_cycle_limit: 6

  # ═══════════════════════════════════════════════════════════════════════════
  # Generation Settings (v1.0.0 - ENFORCED Briq Ranges)
  # ═══════════════════════════════════════════════════════════════════════════
  
  # Briq Granularity Control (0-9) - NOW ENFORCED!
  # v1.0.0: Briq counts are now ENFORCED, not just hints to the AI.
  #
  # SENSITIVITY SCALE:
  #   9 = Monolithic    (exactly 1 briq)
  #   8 = Very Broad    (2-3 briqs)
  #   7 = Broad         (3-5 briqs)   ← RECOMMENDED DEFAULT
  #   6 = Feature-level (5-8 briqs)
  #   5 = Component     (8-12 briqs)
  #   4 = Balanced      (10-15 briqs)
  #   3 = Standard      (15-20 briqs)
  #   2 = High Gran.    (20-30 briqs)
  #   1 = Very High     (30-40 briqs)
  #   0 = Atomic        (40-60 briqs)
  #
  # RECOMMENDATIONS:
  #   Simple projects (web server, API): sens=7, cycles=4
  #   Medium projects (full-stack app):  sens=6, cycles=5
  #   Complex projects (multi-service):  sens=5, cycles=6
  briq_sensitivity: 3

  # Operational Mode
  mode: program

# ═══════════════════════════════════════════════════════════════════════════════
# MINDSTAQ CONFIGURATION (v1.1.0)
# Zero-Cost Local Code Generation Engine
# ═══════════════════════════════════════════════════════════════════════════════
mindstaq:
  enabled: true
  version: "1.0.0"
  
  # Qomputator - Complexity Scoring (0-666 Scale)
  qomputator:
    thresholds:
      tier_0_max: 85         # 0-85   → Qrystallizer (template engine)
      tier_1_max: 400         # 101-400 → sQavanger (search via Qrawler)
      tier_2_max: 666         # 401-666 → Qombinator (evolutionary synthesis)
    weights:
      lexical:
        word_count_multiplier: 2
        max_word_score: 50
      technical:
        entity_weight: 15
        multi_entity_bonus: 20
      reasoning:
        optimization: 30
        design: 40
        concurrency: 25
        security: 35
  
  # Qrystallizer - Template Engine (Tier 0)
  qrystallizer:
    enabled: true
    min_similarity: 0.85
  
  # sQavanger - Search Harvester (Tier 1)
  sqavanger:
    strategy: parallel
    timeout: 10
    max_results: 10
  
  # Qrawler - SearXNG Instance (v2.0 Feature)
  qrawler:
    enabled: false
    url: "http://localhost:8888"
  
  # Qombinator - Evolutionary Synthesis (Tier 2)
  qombinator:
    enabled: true
    z3_enabled: false
  
  # Qoncentrator - AST Grafting
  qoncentrator:
    auto_resolve_imports: true
    sort_imports: true
    backend: ast
  
  # Qonscience - Verification
  qonscience:
    max_iterations: 5
    auto_fix:
      syntax_errors: true
      missing_imports: true
      undefined_names: true
