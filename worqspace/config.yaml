# QonQrete Config
retry:
  # Enable/disable retry mechanism
  enabled: true

  # Maximum attempts per briq (4 = initial attempt + bounded retries)
  max_attempts: 4

  # Stop entire cycle if a briq fails after all retries
  stop_on_briq_fail: false

  # Delay between retries in seconds
  retry_delay: 2

repair:
  # Maximum same-run repair attempts allowed for a single build pass.
  # Legacy alias: max_attempts
  # Same-run repairs consume max_total_iterations budget but do not increment max_build_passes.
  max_attempts_per_build_pass: 2
  max_attempts: 2
  # When true, InstruQtor emits a bounded recommended retry/repair budget from
  # task complexity. Explicit non-default overrides still win.
  auto_repair_amount: true
  # Deterministic bounded repair escalation (class + attempt aware).
  repair_escalation:
    enabled: true
    max_level: 4
    start_policy: failure_class
    bump_policy: on_same_class_repeat

sqrewdriver:
  enabled: true
  mode: inspection_repair_loop
  max_repair_loops_per_build_pass: null
  success_policy: hard_gate_success
  write_repair_brief: true
  include_reqap_excerpt_chars: 12000
  include_validation_issue_limit: 50
  include_prior_attempts: true
  generic_validation_only: true

# AI budgeting configuration
ai_budgeting:
  dry_run_provider: deepseek
  enable_no_loss_chunking: true
  summarize_optional_sections: true
  include_previous_log: false
  previous_log_max_chars: 12000
  max_preload_chunks_per_request: 48
  chunk_target_input_tokens: 24000
  audit_dir: audit/ai_payloads

  # General token configuration
  task_output_tokens:
    code_generation: 6000
    review: 2000
    planning: 2500
  agent_output_tokens:
    construqtor: 6000
    inspeqtor: 2000
    instruqtor: 2500

  # Per provider budgeting configuration
  providers:

    deepseek:
      defaults:
        safe_input_tokens: 616000
        safe_output_tokens: 384000
        total_context_window: 1000000
        chars_per_token: 3.33
        supports_multi_message_history: true
        supports_chunk_preload: true
        supports_system_messages: true

    codeseeq:
      defaults:
        safe_input_tokens: 616000
        safe_output_tokens: 384000
        total_context_window: 1000000
        chars_per_token: 3.33
        supports_multi_message_history: true
        supports_chunk_preload: false
        supports_system_messages: true

    openai:
      defaults:
        safe_input_tokens: 922000
        safe_output_tokens: 128000
        total_context_window: 1050000
        chars_per_token: 4.0
        supports_multi_message_history: true
        supports_chunk_preload: true
        supports_system_messages: true

    gemini:
      defaults:
        safe_input_tokens: 983040
        safe_output_tokens: 65536
        total_context_window: 1048576
        chars_per_token: 4.0
        supports_multi_message_history: true
        supports_chunk_preload: true
        supports_system_messages: true

    anthropic:
      defaults:
        safe_input_tokens: 872000
        safe_output_tokens: 128000
        total_context_window: 1000000
        chars_per_token: 4.0
        supports_multi_message_history: true
        supports_chunk_preload: true
        supports_system_messages: true

    # v1.3.12: mlx provider — local / LAN OpenAI-compatible runtimes.
    mlx:
      defaults:
        safe_input_tokens: 8192
        safe_output_tokens: 8192
        total_context_window: 16384
        chars_per_token: 4.0
        supports_multi_message_history: true
        supports_chunk_preload: true
        supports_system_messages: true

    # v1.3.12: llama-cpp provider — local / LAN OpenAI-compatible runtimes.
    llama-cpp:
      defaults:
        safe_input_tokens: 4096
        safe_output_tokens: 4096
        total_context_window: 8192
        chars_per_token: 4.0
        supports_multi_message_history: true
        supports_chunk_preload: true
        supports_system_messages: true

    # v1.3.12: venice provider — Venice API (OpenAI-compatible).
    # Accepts any valid Venice model ID; defaults are generous and
    # per-agent `context_window` / `max_tokens` may narrow them per model.
    venice:
      defaults:
        safe_input_tokens: 80000
        safe_output_tokens: 8192
        total_context_window: 100000
        chars_per_token: 3.33
        supports_multi_message_history: true
        supports_chunk_preload: true
        supports_system_messages: true

# Per briQ build and review
interleaved:
  enabled: true
  local_validation: true
  ai_quick_review: false
  retry_on_review_fail: true

# Qualifier verification per file creation or modification
verification:
  enabled: true
  checks:
    syntax: true              # Python syntax validation (compile())
    imports: true             # Check if imports resolve to files
    skeleton_match: true      # Compare expected vs actual function signatures

# Agent configuration settings
agents:

  qrystallizer:
    provider: deepseek
    model: deepseek-v4-flash
    timeout: 600
    enabled: true
    min_complexity_score: 200  # Below this score, don't enhance
    min_lines: 200             # Below this line count, don't enhance

    # v1.3.12: Per-agent capability overrides (apply to ANY provider).
    #   api_base_url:   override the API base URL (REQUIRED for mlx/llama-cpp).
    #   max_tokens:     override max output tokens for this agent.
    #   context_window: override total context window (input + output) for this agent.
    #   provider: mlx | llama-cpp | venice
    #   model: "real-model-id" (for venice)
    # CodeSeeq provider: routes through sibling ./codeseeq CLI.
    # Requires DEEPSEEK_API_KEY and CodeSeeq executable from the QonQrete runtime.
    # In default container mode, use host mode or configure QONQ_CODESEEQ_BIN/mounting.
    # provider: codeseeq
    # model: deepseek-v4-flash
    # model: deepseek-v4-flash-thinking
    # model: deepseek-v4-pro
    # model: deepseek-v4-pro-thinking
    # codeseeq_path: "../codeseeq/codeseeq"

  qonstrictor:
    provider: local
    model: qonstrictor
    timeout: 600

    # v1.3.12: Per-agent capability overrides (apply to ANY provider).
    #   api_base_url:   override the API base URL (REQUIRED for mlx/llama-cpp).
    #   max_tokens:     override max output tokens for this agent.
    #   context_window: override total context window (input + output) for this agent.
    #   provider: mlx | llama-cpp | venice
    #   model: "real-model-id" (for venice)

  instruqtor:
    provider: deepseek
    model: deepseek-v4-pro
    timeout: 600

    # v1.3.12: Per-agent capability overrides (apply to ANY provider).
    #   api_base_url:   override the API base URL (REQUIRED for mlx/llama-cpp).
    #   max_tokens:     override max output tokens for this agent.
    #   context_window: override total context window (input + output) for this agent.
    #   provider: mlx | llama-cpp | venice
    #   model: "real-model-id" (for venice)
    # CodeSeeq provider: routes through sibling ./codeseeq CLI.
    # Requires DEEPSEEK_API_KEY and CodeSeeq executable from the QonQrete runtime.
    # In default container mode, use host mode or configure QONQ_CODESEEQ_BIN/mounting.
    # provider: codeseeq
    # model: deepseek-v4-flash
    # model: deepseek-v4-flash-thinking
    # model: deepseek-v4-pro
    # model: deepseek-v4-pro-thinking
    # codeseeq_path: "../codeseeq/codeseeq"

  calqulator:
    provider: local
    model: calqulator

    # v1.3.12: Per-agent capability overrides (apply to ANY provider).
    #   api_base_url:   override the API base URL (REQUIRED for mlx/llama-cpp).
    #   max_tokens:     override max output tokens for this agent.
    #   context_window: override total context window (input + output) for this agent.
    #   provider: mlx | llama-cpp | venice
    #   model: "real-model-id" (for venice)

  construqtor:
    provider: codeseeq
    model: deepseek-v4-flash
    timeout: 600
    # coding_mode: heredoc | direct | hybrid
    coding_mode: hybrid

    # v1.3.12: Per-agent capability overrides (apply to ANY provider).
    #   api_base_url:   override the API base URL (REQUIRED for mlx/llama-cpp).
    #   max_tokens:     override max output tokens for this agent.
    #   context_window: override total context window (input + output) for this agent.
    # Uncomment and set as needed. Per-agent values take priority over
    # provider defaults and CAPABILITY_TABLE entries in lib_ai.py.
    # api_base_url: "http://localhost:8080/v1"
    # max_tokens: 8192
    # context_window: 16384

    # v1.3.12: Example — use the mlx provider with a local MLX runtime.
    #   provider: mlx
    #   api_base_url: "http://localhost:1234/v1"
    #   # max_tokens: 8192
    #   # context_window: 16384
    #   # MLX_API_KEY optional

    # v1.3.12: Example — use the llama-cpp provider with a local llama.cpp runtime.
    #   provider: llama-cpp
    #   api_base_url: "http://localhost:8080/v1"
    #   # max_tokens: 4096
    #   # context_window: 8192
    #   # LLAMA_CPP_API_KEY optional

    # v1.3.12: Example — use the venice provider with a real Venice model ID.
    # NOTE: Venice dispatch requires a non-empty model at runtime.
    # Keep this set to a valid Venice model ID (for this repo the default
    # target is deepseek-v3.2).
    #   provider: venice
    #   model: "deepseek-v3.2"
    #   # api_base_url: "https://api.venice.ai/api/v1"   # default, override only if proxying
    #   venice_parameters:
    #     include_venice_system_prompt: false
    #   # VENICE_API_KEY is REQUIRED and does NOT fall back to OPENAI_API_KEY.

    # CodeSeeq provider: routes through sibling ./codeseeq CLI.
    # Requires DEEPSEEK_API_KEY and CodeSeeq executable from the QonQrete runtime.
    # In default container mode, use host mode or configure QONQ_CODESEEQ_BIN/mounting.
    # provider: codeseeq
    # model: deepseek-v4-flash
    # model: deepseek-v4-flash-thinking
    # model: deepseek-v4-pro
    # model: deepseek-v4-pro-thinking
    # codeseeq_path: "../codeseeq/codeseeq"

  inspeqtor:
    provider: deepseek
    model: deepseek-v4-pro
    timeout: 600

    # v1.3.12: Per-agent capability overrides (apply to ANY provider).
    #   api_base_url:   override the API base URL (REQUIRED for mlx/llama-cpp).
    #   max_tokens:     override max output tokens for this agent.
    #   context_window: override total context window (input + output) for this agent.
    #   provider: mlx | llama-cpp | venice
    #   model: "real-model-id" (for venice)
    # CodeSeeq provider: routes through sibling ./codeseeq CLI.
    # Requires DEEPSEEK_API_KEY and CodeSeeq executable from the QonQrete runtime.
    # In default container mode, use host mode or configure QONQ_CODESEEQ_BIN/mounting.
    # provider: codeseeq
    # model: deepseek-v4-flash
    # model: deepseek-v4-flash-thinking
    # model: deepseek-v4-pro
    # model: deepseek-v4-pro-thinking
    # codeseeq_path: "../codeseeq/codeseeq"

    batch_mode: true
    batch_token_roof: 120000
    batch_max_briqs: 24

    # Per briQ limits when batch mode is turned off
    max_prompt_chars_per_briq: 1000000
    max_context_files_per_briq: 80
    max_chars_per_context_file: 160000

    # Context filtering
    use_filtered_context: true
    include_neighbor_depth: 1

    # Executed smoketest stage (runs after qualification, before AI review).
    # Enabled by default so InspeQtor gathers real runtime signal and feeds it into repair planning.
    #
    # Each adapter entry's command(s) MAY declare an `execution_kind` to tell
    # the system how to classify its evidence. Semantics are honest:
    #   - static:   parse/compile/syntax-only; does NOT exercise runtime code paths
    #               (e.g. `python -m py_compile`, `bash -n`, `node --check`,
    #                `tsc --noEmit`, HTML/CSS structural inspection)
    #   - executed: actually runs program logic (e.g. `python -m unittest discover`,
    #               `npm run smoke`, grounded CLI `--help`)
    #   - auto:     let the classifier decide (conservative: unknown => static)
    #
    # When `execution_kind` is omitted, the classifier infers conservatively —
    # a subprocess running successfully is NEVER sufficient to claim executed
    # smoke. Static checks never masquerade as executed evidence downstream.
    #
    # Per-adapter shape (scalar):
    #   command: "python -m py_compile"
    #   execution_kind: static
    #
    # Per-adapter shape (structured list; each entry may have its own kind):
    #   commands:
    #     - command: "npm run smoke"
    #       execution_kind: executed
    #     - command: "npm run lint"
    #       execution_kind: static
    smoketest:
      enabled: true
      # scoped = only touched files/ecosystems, full = whole repository inventory
      mode: scoped
      timeout_seconds: 300
      max_output_chars: 9600
      adapters:
        python:
          enabled: true
          # Compile changed Python files without executing app logic.
          command: 'python -m py_compile'
          execution_kind: syntax
          append_changed_files: true
        shell:
          enabled: true
          # Syntax-check changed shell scripts.
          command: 'bash -n'
          execution_kind: syntax
          append_changed_files: true
        js_ts:
          enabled: true
          # Syntax-check changed JavaScript/TypeScript files when Node is available.
          command: 'node --check'
          execution_kind: syntax
          append_changed_files: true
        html_css:
          enabled: true
          # Basic structural smoke for changed HTML/CSS files without external linters.
          # This is file inspection only — no runtime behavior exercised, so
          # it is declared `static` even though it uses a python subprocess.
          command: 'python -c "from pathlib import Path; import sys; bad=[]; files=sys.argv[1:]; [bad.append(f\"{p}: empty file\") if not Path(p).read_text(encoding=\"utf-8\").strip() else None for p in files]; [bad.append(f\"{p}: missing html/doctypish structure\") if p.lower().endswith(\".html\") and \"<html\" not in Path(p).read_text(encoding=\"utf-8\").lower() and \"<!doctype\" not in Path(p).read_text(encoding=\"utf-8\").lower() else None for p in files]; [bad.append(f\"{p}: no css rule blocks found\") if p.lower().endswith(\".css\") and \"{\" not in Path(p).read_text(encoding=\"utf-8\") and \"}\" not in Path(p).read_text(encoding=\"utf-8\") else None for p in files]; print(\"basic html/css smoke ok\" if not bad else \"\\n\".join(bad)); raise SystemExit(1 if bad else 0)"'
          execution_kind: static
          append_changed_files: true

  qontextor:
    provider: local
    model: qontextor

    # Modes: fast (shallow structural scan), complex (shared graph + language extractors for Python/shell/JS/TS/HTML/CSS)
    local_mode: complex # ONLY when provider = local

  qompressor:
    provider: local
    model: qompressor
    # Deterministic multi-language skeletonizer. Python uses stdlib AST. In the shipped container/provisioned environment, shell/JS-TS/HTML/CSS use native/adapted tooling.
    # Reduced local environments may fall back. Tree-sitter fallback is optional and only activates after explicitly installing requirements-optional-tree-sitter.txt.

  qontrabender:
    provider: local
    model: qontrabender
    policy_file: "./caching_policy.yaml"

    # Cache manipulation modes:
    #   - local_fast:        Ultra-fast, skeleton only, no remote cache
    #   - local_smart:       Default - variable fidelity, local only (RECOMMENDED)
    #   - cyber_bedrock:     Remote cache for stable bedrock
    #   - cyber_aggressive:  Aggressive remote caching, more churn
    #   - paranoid_mincloud: Minimal cloud exposure, skeletons only
    #   - debug_repro:       Maximum audit logging for debugging
    mode: local_smart
    provider_cache:
      enabled: true
      gemini_explicit_enabled: true
      anthropic_cache_control_enabled: true
      openai_stable_prefix_enabled: true
      deepseek_stable_prefix_enabled: true
      cache_ttl_minutes: 60
      # Optional; only used on providers/client paths that support it.
      prompt_cache_key_template: "qonqrete:{qage_id}:{context_hash}"

# General agent and run configuration
options:
  # Enable/disable token optimization agents in general
  use_qompressor: auto
  use_qontextor: auto
  use_qontrabender: auto
  context_strategy: hybrid_fidelity

  # User approval gate per global iteration/pass boundary
  cheqpoint: false

  # Hard outer safety cap. Counts every actual pass: build + repair.
  max_total_iterations: 3
  # Compatibility alias for older configs / CLI wording.
  auto_cycle_limit: 3
  # Hard cap for non-repair build passes only.
  max_build_passes: 4  # (only used when auto_cycle=false)
  # How InstruQtor estimated build passes are used. advisory = recorded only, scheduler = can continue with later build passes when allowed.
  cycle_estimate_mode: scheduler

  # Cost estimation gate
  cost_confirmation_gate: false

  # Automatic briQ sensitivity detection (default on). When true, the manual
  # briq_sensitivity value is ignored and InstruQtor determines the right granularity.
  auto_briq_sens: true

  # Automatic cycle/iteration count determination (default on). When true, the manual
  # max_total_iterations and max_build_passes are ignored and the scheduler determines
  # the right number of build passes and repair cycles.
  # CLI switches (--cyqles <N>, -b <N>) still override both auto modes.
  auto_cycle: true

  # Manual briQ sensitivity (0-16) Higher number = more briQs, but on a bounded practical scale.
  #   0  = Monolithic    (1 briq)
  #   1  = Tiny split    (2 briqs)
  #   2  = Very broad    (2-3 briqs)
  #   3  = Broad         (3-4 briqs)
  #   4  = Feature       (4-6 briqs)
  #   5  = Balanced      (5-7 briqs)
  #   6  = Detailed      (6-9 briqs)
  #   7  = High          (8-12 briqs)
  #   8  = Very High     (10-15 briqs)
  #   9  = Atomic-ish    (12-18 briqs)
  #  10  = Ultra         (15-22 briqs)
  #  11  = Mega          (18-28 briqs)
  #  12  = Hyper         (22-36 briqs)
  #  13  = Extreme       (28-48 briqs)
  #  14  = Maximum       (36-64 briqs)
  #  15  = Insane        (48-84 briqs)
  #  16  = QONQRETE MAX  (64-120 briqs)
  briq_sensitivity: 3  # (only used when auto_briq_sens=false)

  # Run Mode: program (functional), innovative (always suggest improvements), enterprise (include monitoring, logging and more)
  mode: program

context_strategy:
  normal: hybrid_fidelity
  repair: repair_truth
  editable_files: full
  repair_targets: full
  direct_dependencies: full_if_small
  direct_dependencies_full_if_small_max_chars: 90000
  indirect_dependencies: skeleton_plus_qontext
  distant_files: skeleton
  stable_prefix_cache: true
  max_full_neighbors: 24
  max_indirect_neighbors: 40
