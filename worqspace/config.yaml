# QonQrete Configuration v2.1.9-stable
# ═══════════════════════════════════════════════════════════════════════════════
# v2.1.9 CRITICAL FIX: MODULES NOW WIRED INTO PIPELINE!
# 
# Previously, modules like MCTS, Darwinian, Wisdom Pits existed but were
# NEVER CALLED during code generation. This version wires them in!
#
# NEW in v2.1.9: INVERTED BRIQ SENSITIVITY SCALE! 🔄
# Higher number = MORE briqs (more intuitive!)
#
# BRIQ SENSITIVITY SCALE (0-16):
#   0  = Monolithic (1 briq)         - Single giant briq
#   1  = Very Broad (2-3 briqs)      - Major chunks only
#   2  = Broad (3-5 briqs)           - Large components
#   3  = Feature-level (5-8 briqs)   - Per-feature
#   4  = Component-level (8-12)      - Per-component
#   5  = Balanced (10-15 briqs)      ← RECOMMENDED DEFAULT
#   6  = Standard (15-20 briqs)      - Most files separate
#   7  = High (20-30 briqs)          - Detailed split
#   8  = Very High (30-40 briqs)     - Fine-grained
#   9  = Atomic (40-60 briqs)        - Maximum detail
#  10  = Ultra (50-75 briqs)         - Enterprise projects
#  11  = Mega (60-90 briqs)          - Large enterprise
#  12  = Hyper (75-110 briqs)        - Complex architectures
#  13  = Extreme (90-130 briqs)      - Multi-layer systems
#  14  = Maximum (110-160 briqs)     - Critical systems
#  15  = Insane (130-200 briqs)      - Mega specifications
#  16  = QONQRETE MAX (160-250)      - Enterprise mega-tasqs!
#
# - LocalInstruQtor: instruqtor.provider = 'local' (FREE task splitting)
# - MindstaQ: construqtor.provider = 'local' (FREE code generation)
# - LocalInspeQtor: inspeqtor.provider = 'local' (FREE code review)
# - briq_sensitivity: 5 (Balanced: 10-15 briqs) ← NEW DEFAULT
# - auto_cycle_limit: 6 (Optimal for complex projects)
# 
# NOTE: When using local construqtor, qontrabender and calqulator are auto-skipped
# ═══════════════════════════════════════════════════════════════════════════════

# ═══════════════════════════════════════════════════════════════════════════════
# RETRY CONFIGURATION (v0.8.2+)
# ═══════════════════════════════════════════════════════════════════════════════
retry:
  # Enable/disable retry mechanism
  enabled: true
  
  # Maximum attempts per briq (1 = no retry, 3 = 2 retries)
  max_attempts: 3
  
  # Stop entire cycle if a briq fails after all retries?
  # true = stop immediately on briq failure (fail-fast)
  # false = continue to next briq, collect all failures (fail-tolerant)
  stop_on_briq_fail: false
  
  # Delay between retries (seconds)
  retry_delay: 2

# ═══════════════════════════════════════════════════════════════════════════════
# INTERLEAVED PIPELINE (NEW in v0.8.3)
# ═══════════════════════════════════════════════════════════════════════════════
# Build → Review → Build → Review (per briq)
interleaved:
  # Enable interleaved build + review per briq
  enabled: true
  
  # Run local validation after each briq (syntax, imports) - NO AI
  local_validation: true
  
  # Run lightweight AI review after each briq
  # Set to false for faster builds, true for better quality assurance
  ai_quick_review: false
  
  # Retry briq build if AI review fails
  retry_on_review_fail: true

# ═══════════════════════════════════════════════════════════════════════════════
# LOCAL VERIFICATION (v0.8.2+)
# ═══════════════════════════════════════════════════════════════════════════════
verification:
  # Enable local verification after all briqs complete
  enabled: true
  
  # What to check
  checks:
    syntax: true              # Python syntax validation (compile())
    imports: true             # Check if imports resolve to files
    skeleton_match: true      # Compare expected vs actual function signatures

agents:
  # ═══════════════════════════════════════════════════════════════════════════
  # TASQLEVELER - Task Enhancement (v1.2.0: Now supports LocalTasqLeveler!)
  # ═══════════════════════════════════════════════════════════════════════════
  # tasqleveler:
  #   # PROVIDER OPTIONS:
  #   # ├─ local + model: tasqleveler  ← FREE FOREVER! Pattern-based enhancement
  #   # ├─ openai                      ← GPT-4 (default)
  #   # ├─ anthropic                   ← Claude
  #   # └─ gemini                      ← Google Gemini
  #   provider: local        # ← Uncomment to enable LocalTasqLeveler
  #   model: tasqleveler     # ← Only enhances tasks above threshold size
  #   # THRESHOLD CONFIG (optional, v1.2.1 defaults):
  #   # min_chars: 100       # Minimum chars to trigger enhancement
  #   # min_lines: 5         # Minimum lines to trigger enhancement
  #   # min_sections: 2      # Minimum sections to trigger enhancement

  # ═══════════════════════════════════════════════════════════════════════════
  # INSTRUQTOR - Briq Planning (v1.1.2: Now supports LocalInstruQtor!)
  # ═══════════════════════════════════════════════════════════════════════════
  instruqtor:
    # PROVIDER OPTIONS:
    # ├─ local + model: instruqtor  ← FREE FOREVER! Pattern-based task splitting
    # ├─ openai                     ← GPT-4 (default)
    # ├─ anthropic                  ← Claude
    # ├─ gemini                     ← Google Gemini
    # └─ deepseek                   ← Cheap cloud option
    provider: local        # v1.7.8: LOCAL BY DEFAULT!
    model: instruqtor      # LocalInstruQtor: splits by paragraphs, bullets, sections
    # provider: openai     # ← Uncomment for cloud mode
    # model: gpt-4.1-nano  # $0.10/$0.40 per 1M - cheap & smart enough

  calqulator:
    provider: local
    model: calqulator
    # NOTE: Calqulator is auto-skipped when construqtor.provider is 'local'

  # ═══════════════════════════════════════════════════════════════════════════
  # CONSTRUQTOR - Code Generation (v1.2.0: Now supports mindstaQ!)
  # ═══════════════════════════════════════════════════════════════════════════
  construqtor:
    # PROVIDER OPTIONS:
    # ├─ local + model: mindstaq  ← FREE FOREVER! No LLM, symbolic reasoning
    # ├─ gemini                   ← Google (current default)
    # ├─ openai                   ← GPT-4
    # ├─ anthropic                ← Claude
    # └─ deepseek                 ← Cheap cloud option
    provider: local        # v1.7.8: LOCAL BY DEFAULT!
    model: mindstaq        # MindstaQ: Zero-LLM code generation engine
    # provider: gemini     # ← Uncomment for cloud mode
    # model: gemini-2.5-flash    # $1.25/$10.00 per 1M - best for code generation

  # ═══════════════════════════════════════════════════════════════════════════
  # INSPEQTOR - Code Review (v1.1.2: Now supports LocalInspeQtor!)
  # ═══════════════════════════════════════════════════════════════════════════
  inspeqtor:
    # PROVIDER OPTIONS:
    # ├─ local + model: inspeqtor  ← FREE FOREVER! AST-based code review
    # ├─ openai                    ← GPT-4 (default)
    # ├─ anthropic                 ← Claude
    # ├─ gemini                    ← Google Gemini
    # └─ deepseek                  ← Cheap cloud option
    provider: local        # v1.7.8: LOCAL BY DEFAULT!
    model: inspeqtor       # LocalInspeQtor: AST + pattern-based review
    # provider: openai     # ← Uncomment for cloud mode
    # model: gpt-4.1-mini  # $0.10/$0.40 per 1M - cheap & smart enough
    
    # BATCHED REVIEW MODE (v0.8.6+) - 90% fewer API calls!
    batch_mode: true                 # Group briqs into batches
    batch_token_roof: 60000          # Max input tokens per batch (~240KB)
    batch_max_briqs: 12              # Max briqs per batch (safety cap)
    
    # Legacy per-briq limits (used when batch_mode=false)
    max_prompt_chars_per_briq: 500000
    max_context_files_per_briq: 40
    max_chars_per_context_file: 80000
    
    # Context filtering
    use_filtered_context: true
    include_neighbor_depth: 1

  qontextor:
    provider: local
    model: qontextor
    # local_mode: 'fast' = AST-only analysis
    #             'complex' = AST + deep semantic analysis
    local_mode: complex

  qompressor:
    provider: local
    model: qompressor

  qontrabender:
    provider: local
    model: qontrabender
    # NOTE: Qontrabender is auto-skipped when construqtor.provider is 'local'
    # (It's specifically for Gemini context caching)
    
    # ═══════════════════════════════════════════════════════════════════════════
    # POLICY-DRIVEN CONFIGURATION (v0.8.0)
    # ═══════════════════════════════════════════════════════════════════════════
    
    # Path to caching policy file (relative to worqspace)
    policy_file: "./caching_policy.yaml"
    
    # Select operational mode from caching_policy.yaml
    # Available modes:
    #   - local_fast:       Ultra-fast, skeleton only, no remote cache
    #   - local_smart:      Default - variable fidelity, local only (RECOMMENDED)
    #   - cyber_bedrock:    Remote cache for stable bedrock
    #   - cyber_aggressive: Aggressive remote caching, more churn
    #   - paranoid_mincloud: Minimal cloud exposure, skeletons only
    #   - debug_repro:      Maximum audit logging for debugging
    mode: local_smart

options:
  # ═══════════════════════════════════════════════════════════════════════════
  # Agent Enable/Disable
  # ═══════════════════════════════════════════════════════════════════════════
  
  # Enable/disable Qompressor (skeleton generation)
  use_qompressor: true
  
  # Enable/disable Qontextor (context indexing)
  use_qontextor: true

  # Enable/disable Qontrabender (hybrid caching with policy-driven fidelity)
  use_qontrabender: true

  # ═══════════════════════════════════════════════════════════════════════════
  # Cheqpoint Configuration
  # ═══════════════════════════════════════════════════════════════════════════
  
  # true = User-gated mode (cheqpoints enabled)
  # false = Autonomous mode (cheqpoints disabled)
  cheqpoint: false

  # Max cycles in auto-mode (recommended: 4 for simple projects, 5-6 for complex)
  auto_cycle_limit: 6

  # ═══════════════════════════════════════════════════════════════════════════
  # Generation Settings (v1.0.0 - ENFORCED Briq Ranges)
  # ═══════════════════════════════════════════════════════════════════════════
  
  # Briq Granularity Control (0-9) - NOW ENFORCED!
  # v1.0.0: Briq counts are now ENFORCED, not just hints to the AI.
  #
  # SENSITIVITY SCALE:
  #   9 = Monolithic    (exactly 1 briq)
  #   8 = Very Broad    (2-3 briqs)
  #   7 = Broad         (3-5 briqs)   ← RECOMMENDED DEFAULT
  #   6 = Feature-level (5-8 briqs)
  #   5 = Component     (8-12 briqs)
  #   4 = Balanced      (10-15 briqs)
  #   3 = Standard      (15-20 briqs)
  #   2 = High Gran.    (20-30 briqs)
  #   1 = Very High     (30-40 briqs)
  #   0 = Atomic        (40-60 briqs)
  #
  # RECOMMENDATIONS:
  #   Simple projects (web server, API): sens=7, cycles=4
  #   Medium projects (full-stack app):  sens=6, cycles=5
  #   Complex projects (multi-service):  sens=5, cycles=6
  briq_sensitivity: 5  # v2.1.3: Balanced (10-15 briqs) - Higher = More briqs

  # Operational Mode
  mode: program

# ═══════════════════════════════════════════════════════════════════════════════
# MINDSTAQ CONFIGURATION (v1.1.0)
# Zero-Cost Local Code Generation Engine
# ═══════════════════════════════════════════════════════════════════════════════
mindstaq:

  # v2.1.9: TripleThreat - Run all tiers in parallel with FULL PIPELINE INTEGRATION!
  triple_threat:
    enabled: true               # Enable parallel tier execution
    timeout_per_tier: 30        # Max seconds per tier
    combine_strategy: best      # best | merge | all
  
  # v2.1.9: Wisdom Pits - Pre-built tool implementations
  # These are expert-crafted implementations for common security tools
  # Set enabled: true when you've populated the wisdom pits storage
  wisdom_pits:
    enabled: false              # DISABLED - set true when ready
    storage_path: "/tmp/wisdom_pits"
    tools:
      - nmap
      - bloodhound
      - feroxbuster
      - masscan
      - nikto
  
  # v2.1.9: MCTS - Monte Carlo Tree Search for code optimization
  # Uses AlphaGo-style strategic search to find optimal implementations
  mcts:
    enabled: true               # ENABLED by default
    iterations: 300             # Search iterations
    time_limit: 30.0            # Max seconds per optimization
    min_improvement: 0.1        # Minimum fitness improvement to use
    min_fitness: 0.5            # Minimum fitness threshold
  
  # v2.1.9: Darwinian Evolution - Genetic algorithm for novel algorithms
  # Best for generating new algorithms from scratch
  darwinian:
    enabled: true               # ENABLED by default
    max_generations: 50         # Evolution generations
    population_size: 20         # Population size per generation
    mutation_rate: 0.3          # Mutation probability
  
  # v2.1.9: Dependency Graph - Multi-file architecture analysis
  # Helps understand project structure for better code integration
  dependency_graph:
    enabled: true               # ENABLED by default
    max_depth: 5                # Max import depth to analyze
    include_stdlib: false       # Don't include standard library
  
  enabled: true
  version: "2.1.9"
  
  # Qomputator - Complexity Scoring (0-666 Scale)
  qomputator:
    thresholds:
      tier_0_max: 85         # 0-85   → Qrystallizer (template engine)
      tier_1_max: 400         # 101-400 → sQavenger (search via Qrawler)
      tier_2_max: 666         # 401-666 → Qombinator (evolutionary synthesis)
    weights:
      lexical:
        word_count_multiplier: 2
        max_word_score: 50
      technical:
        entity_weight: 15
        multi_entity_bonus: 20
      reasoning:
        optimization: 30
        design: 40
        concurrency: 25
        security: 35
  
  # Qrystallizer - Template Engine (Tier 0)
  qrystallizer:
    enabled: true
    min_similarity: 0.85
  
  # sQavenger - Search Harvester (Tier 1)
  # sQavenger - Search Harvester (Tier 1)
  # v2.0.0: SQavenger - Search & Harvest Engine
  sqavenger:
    offline_mode: false          # v2.0.0: Online mode - search web for code snippets
    strategy: parallel
    timeout: 10                  # v2.0.0: 10s per query with graceful fallback
    max_results: 10
  
  # Qrawler - Web Search for Code Harvesting (v1.9.1: FULLY FUNCTIONAL!)
  # Works with SearXNG (recommended) or DuckDuckGo (fallback)
  # v2.0.0: Qrawler - Web Search for Code Harvesting
  qrawler:
    enabled: true                          # v2.0.0: ENABLED for web code search
    searxng_url: "http://172.17.0.1:8888"   # v2.2.6: Host gateway (works from inside Docker!)
    cache_dir: "/tmp/qrawler_cache"        # Cache search results
    cache_ttl_hours: 24                    # Cache expiry
    web_priority_weight: 2.0               # v2.1.6: Boost web results over templates
    # NOTE: If SearXNG unavailable, falls back to DuckDuckGo
    # Install deps: pip install aiohttp beautifulsoup4 duckduckgo-search
  
  # Qombinator - Evolutionary Synthesis (Tier 2)
  qombinator:
    enabled: true
    z3_enabled: true  # v2.0.3: Constraint solver for reasoning
  
  # Qoncentrator - AST Grafting
  qoncentrator:
    auto_resolve_imports: true
    sort_imports: true
    backend: ast
  
  # Qonscience - Verification
  qonscience:
    max_iterations: 5
    auto_fix:
      syntax_errors: true
      missing_imports: true
      undefined_names: true


# ═══════════════════════════════════════════════════════════════════════════════
# DEEP WEB SEARCH (v2.0.1) - Tor Hidden Services
# ═══════════════════════════════════════════════════════════════════════════════
deep_qrawler:
  enabled: false                # DISABLED BY DEFAULT - requires Tor running
  tor_socks_port: 9050          # Tor SOCKS proxy port
  tor_control_port: 9051        # Tor control port for circuit rotation
  timeout: 30                   # Timeout per request in seconds
  max_retries: 3                # Retry count for failed requests
  circuit_rotation: true        # Rotate circuits to avoid rate limiting
  safe_mode: true               # Only use Ahmia (filtered) not Torch (unfiltered)
  max_results_per_source: 10     # Limit results from each source
  engines:
    ahmia: true                 # Safe - filters illegal content
    torch: false                # DANGEROUS - no filtering, use with caution
  # NOTE: Requires: pip install aiohttp aiohttp-socks
  # NOTE: Requires: Tor running on localhost:9050

# ═══════════════════════════════════════════════════════════════════════════════
# Z3 CONSTRAINT SOLVER (v2.0.3) - Formal Reasoning
# ═══════════════════════════════════════════════════════════════════════════════
z3_solver:
  enabled: true                 # Enable z3 constraint solving
  timeout_ms: 5000              # Timeout per solve operation
  features:
    type_synthesis: true        # Use z3 for optimal type conversion paths
    decision_tables: true       # Use z3 for decision table evaluation
    code_verification: true     # Use z3 for code property verification
    complexity_scoring: true    # Use z3 for tier selection constraints
  properties_to_verify:
    - bounded_recursion         # Check recursion has base case
    - type_safe                 # Check type hints are present
    # - no_infinite_loop        # Check for infinite loops (slower)
    # - deterministic           # Check for non-deterministic imports


# ═══════════════════════════════════════════════════════════════════════════════
# PATTERN DATABASE (v2.0.1) - 200+ Code Patterns
# ═══════════════════════════════════════════════════════════════════════════════
pattern_db:
  enabled: true
  categories:
    - http
    - database  
    - auth
    - crypto
    - async
    - testing
    - cli
    - file_io
    - validation
    - logging

# ═══════════════════════════════════════════════════════════════════════════════
# QALIBRATOR + QUALIFIER (v2.0.1) - AST Evolution Loop
# ═══════════════════════════════════════════════════════════════════════════════
qalibrator:
  enabled: true                 # Enable AST mutation evolution
  max_generations: 5            # Maximum evolution iterations
  mutation_rate: 0.3            # Probability of mutation per generation
  mutations:
    swap_statements: true       # Swap order of independent statements
    swap_operators: true        # +/-, ==/!=, and/or
    add_error_handling: true    # Wrap in try/except
    simplify_boolean: true      # Simplify boolean expressions
    add_type_hints: true        # Add type annotations
    extract_function: false     # Extract code blocks (can be disruptive)

qualifier:
  enabled: true
  min_fitness: 0.7              # Minimum fitness to pass (0-1)
  weights:
    syntax: 0.25                # Code compiles
    complexity: 0.15            # Cyclomatic complexity
    style: 0.10                 # PEP8 compliance
    security: 0.20              # No obvious security issues
    documentation: 0.10         # Has docstrings
    testability: 0.10           # Code is testable
    maintainability: 0.10       # Overall maintainability

# ═══════════════════════════════════════════════════════════════════════════════
# WONQ INDEX (v2.0.1) - Local Pattern Memory
# ═══════════════════════════════════════════════════════════════════════════════
wonq_index:
  enabled: true
  cache_dir: "/tmp/wonq_index"  # Where to store the index
  max_entries: 10000            # Maximum cached patterns
  min_score: 200                # Minimum WoNQ score to cache (0-666)

# ═══════════════════════════════════════════════════════════════════════════════
# TIMEWALQER (v2.0.1) - Historical Pattern Tracking
# ═══════════════════════════════════════════════════════════════════════════════
timewalqer:
  enabled: true
  log_file: "/tmp/timewalqer.log"
  track_success: true           # Track successful generations
  track_failures: true          # Track failed generations
  retention_days: 30            # How long to keep history

# ═══════════════════════════════════════════════════════════════════════════════
# PARALLEL HARVESTER (v2.0.1) - Multi-Source Async Search
# ═══════════════════════════════════════════════════════════════════════════════
parallel_harvester:
  enabled: true
  timeout: 15                   # Timeout for all sources combined
  sources:
    pattern_db: true            # Local pattern database
    wonq_index: true            # Previously successful patterns
    qrawler: true               # Web search (clearnet)
    
# ═══════════════════════════════════════════════════════════════════════════════
# SEMANTIC MATCHER (v2.0.1) - AST Similarity Matching
# ═══════════════════════════════════════════════════════════════════════════════
semantic_matcher:
  enabled: true
  min_similarity: 0.6           # Minimum similarity score (0-1)
  features:
    ast_structure: true         # Compare AST node types
    imports: true               # Compare import statements
    function_names: true        # Compare function signatures
    complexity: true            # Compare complexity metrics

# ═══════════════════════════════════════════════════════════════════════════════
# FRANQENSTEIN (v2.0.1) - Smart Code Merger
# ═══════════════════════════════════════════════════════════════════════════════
franqenstein:
  enabled: true
  prefer_type_hints: true       # Prefer code with type hints
  prefer_docstrings: true       # Prefer code with docstrings
  prefer_error_handling: true   # Prefer code with try/except
  dedup_imports: true           # Deduplicate imports when merging

# ═══════════════════════════════════════════════════════════════════════════════
# TEMPLATE BREEDER (v2.0.1) - Genetic Algorithm Evolution
# ═══════════════════════════════════════════════════════════════════════════════
template_breeder:
  enabled: false                # Disabled by default (slow)
  population_size: 10           # Number of individuals
  max_generations: 20           # Maximum generations
  crossover_rate: 0.7           # Probability of crossover
  mutation_rate: 0.1            # Probability of mutation
  elite_count: 2                # Keep top N individuals

# ═══════════════════════════════════════════════════════════════════════════════
# TYPE SYNTHESIS (v2.0.1) - A* Pathfinding for Glue Code
# ═══════════════════════════════════════════════════════════════════════════════
type_synthesis:
  enabled: true
  max_path_length: 5            # Maximum function composition depth
  builtin_transformers: true    # Include Python builtin type conversions
