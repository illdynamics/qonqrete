# QonQrete Pipeline Configuration
# v1.0.4-stable — Contract-enforced pipeline with qontract.d/
#
# PHASE 1 DEMO ORDER:
#   tasqleveler(Qrystallizer) → guard → instruqtor → calqulator → construqtor → qontextor → qompressor → qontrabender → inspeqtor
#
# CANONICAL STAGE ALIASES (PHASE 1 BRIDGE):
#   tasqleveler -> CLARIFICATION
#   guard       -> GUARD
#   instruqtor  -> PLANNING
#   calqulator  -> ESTIMATION
#   construqtor -> BUILD
#   inspeqtor   -> INSPECTION
#
# SUPPORT SERVICES (NOT CANONICAL LIFECYCLE STAGES):
#   qontextor, qompressor, qontrabender
#
# CONTRACT: qontract.d/qontract.{md,json} — generated in cycle 1, mandatory thereafter.
# QODEYARD: Primary truth source for current-cycle code.
# bloq.d: Skeleton cache support artifact — runs BEFORE inspeqtor in actual YAML order.
# qontext.d: Dependency hints support artifact — runs BEFORE inspeqtor in actual YAML order.

agents:
  - name: tasqleveler
    script: tasqleveler.py
    input: "tasq.d/cyqle{N}_tasq.md"
    output: "tasq.d/cyqle{N}_tasq.md"
    description: |
      Canonical Qrystallizer front door, exposed through the legacy tasqleveler alias.
      Produces task/task-spec.v1.json, task/clarification-log.v1.json,
      and clarification-summary.md without mutating the canonical task input.
    cycle_1_only: true

  - name: guard
    script: guard.py
    input: "task/task-spec.v1.json"
    output: "guard/guard-result.v1.json"
    description: |
      Canonical GUARD stage.
      Evaluates the Qrystalized Task Spec before planning, emits Guard Result,
      and hands effective constraints into instruqtor.
    cycle_1_only: true

  - name: instruqtor
    script: instruqtor.py
    input: "tasq.d/cyqle{N}_tasq.md"
    output: briq.d/
    description: |
      Canonical bridge alias: PLANNING.
      Reads cycle tasq and generates briqs. On cycle 1, also generates
      qontract.d/qontract.{md,json} (project constitution).

  - name: calqulator
    script: calqulator.py
    input: "briq.d/"
    output: "briq.d/"
    description: "Canonical bridge alias: ESTIMATION. Estimates token count and cost for each briq and annotates the files."

  - name: construqtor
    script: construqtor.py
    input: briq.d/
    output: 
      - "exeq.d/cyqle{N}_summary.md"
      - "exeq.d/cyqle{N}_changed.md"
    description: |
      Canonical bridge alias: BUILD.
      Parses briqs and generates code. Fail-fast: requires qontract.d/ for cycles > 1.
      Per-briq QontractGuard gating with auto-retry on contract-relevant briqs.
      Context: qontract.d/qontract.md + cycle1 tasq + qontext.d/ + qodeyard tree.

  - name: qontextor
    script: qontextor.py
    input: "exeq.d/cyqle{N}_changed.md"
    output: "qontext.d/"
    description: "Support service only in Phase 1 bridge. Updates qontext.d/ dependency hints based on changed files."

  - name: qompressor
    script: qompressor.py
    input: "qodeyard/"
    output: "bloq.d/"
    description: |
      Support service only in Phase 1 bridge.
      Skeletonizer: mirrors qodeyard into bloq.d with stripped bodies.
      Deterministic summaries (AST-based). Valid Python output guaranteed.
      Correct indentation for module-level functions AND class methods.

  - name: qontrabender
    script: qontrabender.py
    input: 
      - "bloq.d/"
      - "qodeyard/"
      - "qontext.d/"
    output: "qache.d/"
    description: "Support service only in Phase 1 bridge. Cache Bender — assembles hybrid cache payloads for Gemini context caching."
    triggers:
      - "post_qompressor"
      - "pre_construqtor"
      - "manual"

  - name: inspeqtor
    script: inspeqtor.py
    input: 
      - "exeq.d/cyqle{N}_summary.md"
      - "exeq.d/cyqle{N}_changed.md"
    output: "reqap.d/cyqle{N}_reqap.md"
    description: |
      Canonical bridge alias: INSPECTION.
      Multi-Stage Code Review (v1.0.4-stable):
      
      STAGE 0 - QontractGuard (deterministic, AST-based):
        Reads qontract.d/qontract.json, enforces against qodeyard/*.
        FAIL = forces cycle FAIL. Never silently skips.
      
      STAGE 1 - LoQal Verification (deterministic):
        Syntax/import sanity checks.
      
      STAGE 2 - Per-Briq Tactical Reviews (AI):
        Reviews each briq with context. Report-only if guard failed.
      
      STAGE 3 - Global Meta-Review (AI aggregation):
        Final reQap with consolidated suggestions.
      
      Context always includes: qontract.d/qontract.md, tasqs, qodeyard/* (primary).
      Optional: bloq.d/*, qontext.d/* (may be stale — pipeline order).
      Logs all paths to struqture/qonsole_inspeqtor.log with staleness notes.
    
    budget_controlled: true
    stages:
      - name: qontract_guard
        deterministic: true
      - name: loqal_verification
        deterministic: true
      - name: per_briq
        parallel: false
        requires: qontract_guard
      - name: meta_review
        requires: per_briq

options:
  microsandbox: false
