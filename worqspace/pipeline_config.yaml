# QonQrete Dynamic Agent Pipeline - Plug in more easily if you want
# Note: `cyqle{N}` numbering tracks the global iteration index. `cycle_1_only: true` means first build pass only.

agents:

  - name: qrystallizer
    script: qrystallizer.py
    description: |
      Canonical Qrystallizer front door. Clarifies the tasQ, asks questions if needed, Defines acceptance criteria, golden paths.
      Scans user input (tasQ) and detects gaps, asks user to fill in the missing info, and enhance current details.
      Produces task/task-spec.v1.json, task/clarification-log.v1.json and clarification-summary.md without mutating the input.
      If task readiness is NOT_READY, Qrane pauses in a first-class BLOCKED/RUN_WAITING_FOR_INPUT intake state until bounded clarification answers are supplied.
    input: "tasq.d/cyqle{N}_tasq.md"
    output: "tasq.d/cyqle{N}_tasq.md"
    cycle_1_only: true

  - name: qonstrictor
    script: qonstrictor.py
    description: |
      Canonical Qonstrictor stage. Activates strict policies and checking if agents write code according to the rules and policies.
      Evaluates the Qrystalized Task Spec before planning, emits Qonstrictor Result, validates all written files against the rules
      and hands effective constraints into instruqtor.
      Acts as a fallback guard once intake clarification has reached READY.
    input: "task/task-spec.v1.json"
    output: "qontract.d/qonstrictor-result.v1.json"
    cycle_1_only: true

  - name: instruqtor
    script: instruqtor.py
    description: |
      Canonical PLANNING agent. Scans tasQ and determines how granular the tasQ will be split up into briQs and building groups.
      Reads the current pass tasq and generates briqs. On the first build pass, also generates the qontract with the rules for this tasQ based on the tasQ.
      Also estimates how many build passes may be required. By default this estimate is advisory unless scheduler mode is explicitly enabled.
    input: "tasq.d/cyqle{N}_tasq.md"
    output: "briq.d/"

  - name: calqulator
    script: calqulator.py
    description: |
      Canonical cost calculation agent. Estimates token count and cost for each briq and annotates the files.
      Will use free API calls for the providers that support token calculation per API-call.
      As fallback and for providers that do not support this, it will use carefully determined formulae.
    input: "briq.d/"
    output: "briq.d/"

  - name: construqtor
    script: construqtor.py
    description: |
      Canonical code writer agent. Will write the code required for all briQs, per building group to preserve bigger component links.
      Parses briqs and generates code. Fail-fast requires qontract.d/ after the first build pass. Repairs files if retries are enabled.
      Per-briq Qonfirmer gating with auto-retry on contract-relevant briqs. Builds per building group to preserve bigger links.
    input: "briq.d/"
    output: 
      - "exeq.d/cyqle{N}_summary.md"
      - "exeq.d/cyqle{N}_changed.md"

  - name: qontextor
    script: qontextor.py
    description: |
      Support service only in Phase 1 bridge. Updates qontext.d/ dependency hints based on changed files.
      It creates a mirror of our codebase in terms of filenames and adds .q.yaml to every file, containing not the code itself,
      but deterministic structural graph/context records for the actual codebase. Produces inspectable per-file .q.yaml artifacts for context reuse and debugging.
    input: "exeq.d/cyqle{N}_changed.md"
    output: "qontext.d/"

  - name: qompressor
    script: qompressor.py
    description: |
      Support service only in Phase 1 bridge. Creates deterministic structural skeletons of qodeyard in bloq.d.
      First-class paths: Python, shell, JavaScript/TypeScript, HTML/CSS.
      Strips bulky bodies while preserving imports, signatures, structural blocks, and useful summaries.
      Optional Tree-sitter fallback can handle additional parseable languages when you explicitly install `requirements-optional-tree-sitter.txt`.
    input: "qodeyard/"
    output: "bloq.d/"

  - name: qontrabender
    script: qontrabender.py
    description: |
      Provider-aware cache/context assembly support service. It prepares stable background bundles and hotset payloads before ConstruQtor.
      Qontrabender runs for all providers when enabled:
      - Gemini may use explicit context caching only when real SDK support/config are available.
      - Anthropic may use cache_control for the stable prefix only.
      - OpenAI/DeepSeek use stable-prefix automatic caching.
      - Local providers use local bundle assembly only.
      Qrane refreshes qompressor, qontextor, and qontrabender before each ConstruQtor build/repair pass; post-ConstruQtor refresh remains optional.
    input: 
      - "bloq.d/"
      - "qodeyard/"
      - "qontext.d/"
    output: "qache.d/"
    triggers:
      - "post_qompressor"
      - "pre_construqtor"
      - "manual"

  - name: inspeqtor
    script: inspeqtor.py
    description: |
      Canonical reviewer agent. Will do a multi-stage deep inspection of the written code and give repair instructions and assessment.
      Checks if the code is complying to our rules and the Qontract and policies. Qualifier agent locally will inspect and verify if the
      code actually passes syntax checks, linters, external validators. Optional smoQetester stage can run static and executed smoketest checks.
      Also kicks in on the per-briQ review stages if turned on.
    input: 
      - "exeq.d/cyqle{N}_summary.md"
      - "exeq.d/cyqle{N}_changed.md"
    output: "reqap.d/cyqle{N}_reqap.md"
    budget_controlled: true
    stages:
      - name: qonfirmer
        deterministic: true
      - name: qualification
        deterministic: true
      - name: smoketest
        deterministic: true
        requires: qualification
      - name: per_briq
        parallel: false
        requires: smoketest
      - name: meta_review
        requires: per_briq
