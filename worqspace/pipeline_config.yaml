# QonQrete Pipeline Configuration
# v0.9.0 - Added TasqLeveler for automatic tasq enhancement
agents:
#  - name: tasqleveler
#    script: tasqleveler.py
#    input: "tasq.d/cyqle{N}_tasq.md"
#    output: "tasq.d/cyqle{N}_tasq.md"  # Enhances in-place, backs up original
#    description: |
#      TasqLeveler v0.9.0 - Automatic Tasq Enhancement
#      
#      RUNS ONCE: Only on Cycle 1
#      
#      Supercharges your tasq.md with:
#      - 📦 Explicit dependency graph (prevents circular imports)
#      - 🎯 Golden path tests (defines success criteria)
#      - 🧪 Mock infrastructure (for testing integrations)
#      - 📋 Global success criteria
#      - ⏱️ Phase priority guidance
#      
#      Impact: +15-20% improvement in output quality
#      
#      Original tasq preserved as tasq_original.md
#    cycle_1_only: true

  - name: instruqtor
    script: instruqtor.py
    input: "tasq.d/cyqle{N}_tasq.md"
    output: briq.d/
    description: "Reads the cycle-specific tasq and generates a comprehensive markdown briq."

  - name: calqulator
    script: calqulator.py
    input: "briq.d/"
    output: "briq.d/" # Modifies files in-place
    description: "Estimates token count and cost for each briq and annotates the files."

  - name: construqtor
    script: construqtor.py
    input: briq.d/
    output: 
      - "exeq.d/cyqle{N}_summary.md"
      - "exeq.d/cyqle{N}_changed.md"
    description: "Parses the markdown briq, executes steps, and outputs separate summaries for execution and changed files."

  - name: inspeqtor
    script: inspeqtor.py
    input: 
      - "exeq.d/cyqle{N}_summary.md"
      - "exeq.d/cyqle{N}_changed.md"
    output: "reqap.d/cyqle{N}_reqap.md"
    description: |
      Multi-Stage Code Review System (v0.8.2):
      
      STAGE 1 - Per-Briq Tactical Reviews:
      - Reviews each briq individually with filtered context
      - Only includes .q.yaml files relevant to changed files
      - Enforces strict budget limits to prevent 400 errors
      - Outputs: reqap.d/cyqle{N}/briq*_reqap.md
      
      STAGE 2 - Global Meta-Review:
      - Aggregates all briq reviews into single assessment
      - Uses NO raw code - only summaries and reqaps
      - Produces final reQap with consolidated suggestions
      - Outputs: reqap.d/cyqle{N}_reqap.md
      
      STAGE 3 - LoQal Verification (NEW in v0.8.2):
      - Deterministic syntax validation (Python compile())
      - Import resolution checking
      - Skeleton signature comparison
      - Results APPENDED to reqap for next cycle
      - Outputs: reqap.d/cyqle{N}_verification.md
      
      The reqap is then promoted to cyqle{N+1}_tasq.md by Qrane's
      promote_reqap() function, carrying all fix info forward.
    
    budget_controlled: true
    stages:
      - name: per_briq
        parallel: false
      - name: meta_review
        requires: per_briq
      - name: loqal_verification
        requires: meta_review

  - name: qontextor
    script: qontextor.py
    input: "exeq.d/cyqle{N}_changed.md"
    output: "qontext.d/"
    description: "Updates the qontext files based on the changed files list."

  - name: qompressor
    script: qompressor.py
    input: "qodeyard/"
    output: "bloq.d/"
    description: "Mirrors qodeyard into bloq.d, stripping code bodies to create skeletons."

  - name: qontrabender
    script: qontrabender.py
    input: 
      - "bloq.d/"
      - "qodeyard/"
      - "qontext.d/"
    output: "qache.d/"
    description: "The Cache Bender - assembles and manages hybrid cache payloads for Gemini context caching."
    triggers:
      - "post_qompressor"
      - "pre_construqtor"
      - "manual"

options:
  microsandbox: false
