# QonQrete Pipeline Configuration
# v1.2.4-stable — Qualifier-Centralized Validation
#
# CORE COMPLETION PATH:
#   qrystallizer → instruqtor → construqtor → qualifier → inspeqtor → qrane
# SUPPORT PASSES THAT MAY ALSO RUN:
#   calqulator before generation; qontextor/qompressor after review
#
# QRYSTAL: Requirements and readiness (Cycle 1 only).
# CONTRACT: Project invariants (generated in cycle 1, mandatory thereafter).
# QUALITY: Build/test artifacts (Qualifier).
# VERDICT: Structured decision JSON (InspeQtor).

agents:
  - name: qrystallizer
    script: qrystallizer.py
    input: "tasq.d/cyqle{N}_tasq.md"
    output: "tasq.d/cyqle{N}_tasq.md"
    description: |
      Qrystallizer v1.2.4 - Cycle-1 Preflight Agent.
      Analyzes tasq and generates requirements.json in qrystal.d/.
      Crucial for Auto-Cycle Mode cycle estimation.
    cycle_1_only: true

  - name: instruqtor
    script: instruqtor.py
    input: "tasq.d/cyqle{N}_tasq.md"
    output: briq.d/
    description: |
      Architect Agent. Breaks requirements into briqs.
      Generates qontract.json on Cycle 1. Respects QONQ_MODE.

  - name: calqulator
    script: calqulator.py
    input: "briq.d/"
    output: "briq.d/"
    description: "Token and cost estimator."

  - name: construqtor
    script: construqtor.py
    input: briq.d/
    output: 
      - "exeq.d/cyqle{N}_summary.md"
      - "exeq.d/cyqle{N}_changed.md"
    description: |
      Code Generation Agent. Writes source to qodeyard/.
      Generates code, records exeQ artifacts, and leaves deterministic validation to Qualifier.

  - name: qualifier
    script: qualifier.py
    input: "qodeyard/"
    output: "quality.d/cyqle{N}/"
    description: |
      Execution Gate Agent. ONLY agent allowed to run project code.
      Runs build/test commands and writes quality.d/ logs.

  - name: inspeqtor
    script: inspeqtor.py
    input: 
      - "exeq.d/cyqle{N}_summary.md"
      - "exeq.d/cyqle{N}_changed.md"
    output: "reqap.d/cyqle{N}_reqap.md"
    description: |
      Review Agent. Produces structured verdict.json.
      Integrates Guard, Quality, and AI meta-review status.
    
    stages:
      - name: qontract_guard
        deterministic: true
      - name: per_briq
        parallel: false
      - name: meta_review
        requires: per_briq

  - name: qontextor
    script: qontextor.py
    input: "exeq.d/cyqle{N}_changed.md"
    output: "qontext.d/"
    description: "Semantic context indexer."

  - name: qompressor
    script: qompressor.py
    input: "qodeyard/"
    output: "bloq.d/"
    description: "Skeletonizer agent."

options:
  microsandbox: false
