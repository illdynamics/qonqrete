# caching_policy.yaml
# ═══════════════════════════════════════════════════════════════════════════════
# Qontrabender Policy Configuration
# ═══════════════════════════════════════════════════════════════════════════════
# Select mode in config.yaml:
#   qontrabender:
#     policy_file: "./caching_policy.yaml"
#     mode: "local_smart"
# ═══════════════════════════════════════════════════════════════════════════════

version: 1

defaults:
  qache_dir: "qache.d"

  volatile_detection:
    use_changed_files_manifest: false
    changed_files_pattern: "exeq.d/*_changed.md"
    use_git_diff_if_available: false
    git_diff_base: "HEAD"
    use_mtime_fallback: false
    mtime_minutes: 5
    use_briq_targets: true
    briq_pattern: "briq.d/*.md"

  budgets:
    cached_max_chars: 1800000
    cached_target_chars: 1200000
    hotset_max_chars: 350000
    hotset_target_chars: 220000

  file_limits:
    full_max_chars_per_file: 200000
    skeleton_max_chars_per_file: 120000
    diff_max_chars_per_file: 120000
    max_files_in_cached: 250
    max_files_in_hotset: 80

  truncation:
    strategy: "tail"
    annotate_truncation: true
    include_reason: true

  render:
    file_wrapper: "xml"
    xml:
      full_tag: "file"
      skeleton_tag: "skeleton"
      diff_tag: "diff"
      attrs:
        - "path"
        - "hash"
        - "tier"
        - "fidelity"
    markdown:
      show_headers: true

  classification:
    signals:
      dependency_rank_weight: 0.50
      symbol_count_weight: 0.20
      inbound_refs_weight: 0.20
      doc_presence_weight: 0.10

    thresholds:
      core_score_min: 0.65
      massive_chars_min: 220000
      generated_score_min: 0.70

  paths:
    exclude_globs:
      - "**/.git/**"
      - "**/.venv/**"
      - "**/venv/**"
      - "**/node_modules/**"
      - "**/__pycache__/**"
      - "**/.pytest_cache/**"
      - "**/dist/**"
      - "**/build/**"
      - "**/*.lock"
      - "**/*.min.js"
      - "**/*.map"
      - "**/*.png"
      - "**/*.jpg"
      - "**/*.jpeg"
      - "**/*.gif"
      - "**/*.webp"
      - "**/*.mp4"
      - "**/*.mov"
      - "**/*.zip"
      - "**/*.pyc"
      - "**/*.pyo"
      - "**/*.so"
      - "**/*.dll"
      - "**/*.exe"

    prefer_docs_globs:
      - "README*"
      - "docs/**"
      - "**/*.md"
      - "**/*.rst"
      - "**/*.txt"
      - "**/*.adoc"
      - "**/openapi*.yml"
      - "**/openapi*.yaml"
      - "**/*.proto"
      - "**/schema*.sql"
      - "**/migrations/**"
      - "**/*.toml"
      - "**/*.ini"
      - "**/*.env.example"

    generated_globs:
      - "**/vendor/**"
      - "**/third_party/**"
      - "**/generated/**"
      - "**/*.gen.*"
      - "**/*_pb2.py"
      - "**/*_pb2_grpc.py"
      - "**/*.swagger.json"

  logging:
    verbose_decisions: false
    write_full_payload_artifacts: false
    write_inputs_refs: false

modes:
  local_fast:
    description: "Ultra-fast local-only. Mostly skeleton + tiny hotset. Minimal disk I/O. No remote cache."
    remote_cache:
      enabled: false
    assembly:
      cached_payload:
        enabled: false
      hotset_payload:
        include:
          - "briq"
          - "recent_errors"
          - "changed_diffs"
          - "touched_files_full_if_small"
    fidelity:
      rules:
        - name: "touched_small_full"
          when:
            volatile: true
            file_chars_lte: 60000
          use: "full"
        - name: "default_skeleton"
          when: {}
          use: "skeleton"
    budgets:
      cached_max_chars: 0
      hotset_max_chars: 200000
      hotset_target_chars: 150000
  local_smart:
    description: "Best default. Variable fidelity locally; strong reproducibility; no provider dependency."
    remote_cache:
      enabled: false
    assembly:
      cached_payload:
        enabled: true
        include:
          - "project_map"
          - "bedrock_docs"
          - "stable_core_files_variable_fidelity"
          - "structural_summaries"
          - "public_api_surface"
      hotset_payload:
        include:
          - "briq"
          - "recent_errors"
          - "changed_diffs"
          - "touched_files_full_or_targeted_symbols"
    fidelity:
      rules:
        - name: "stable_core_full"
          when:
            tier: "stable"
            core_score_gte: 0.65
            volatile: false
            file_chars_lte: 200000
          use: "full"
        - name: "massive_reference_skeleton"
          when:
            volatile: false
            file_chars_gte: 220000
          use: "skeleton"
        - name: "default_skeleton"
          when: {}
          use: "skeleton"

    hotset:
      include_targeted_symbol_bodies: true
      targeted_symbol_body_max_chars: 90000
      include_full_for_touched_if_small: true
      full_for_touched_max_chars: 120000

  cyber_bedrock:
    description: "Remote cache holds stable bedrock (full for stable core + key docs). Hotset always stdin."
    
    remote_cache:
      enabled: true
      provider: "gemini"
      ttl_minutes: 60
      keepalive:
        enabled: true
        refresh_when_remaining_minutes_lte: 12
      upload:
        upload_cached_payload: true
        sanitize:
          enabled: false
          redact_patterns: []

    assembly:
      cached_payload:
        enabled: true
        include:
          - "project_map"
          - "bedrock_docs"
          - "stable_core_files_variable_fidelity"
          - "structural_summaries"
          - "schemas_and_interfaces"
      hotset_payload:
        include:
          - "briq"
          - "recent_errors"
          - "changed_diffs"
          - "touched_files_full_or_targeted_symbols"

    fidelity:
      rules:
        - name: "stable_core_full"
          when:
            tier: "stable"
            core_score_gte: 0.70
            volatile: false
            file_chars_lte: 220000
          use: "full"
        - name: "stable_large_skeleton"
          when:
            volatile: false
            file_chars_gte: 220000
          use: "skeleton"
        - name: "default_skeleton"
          when: {}
          use: "skeleton"

  cyber_aggressive:
    description: "Remote cache is used aggressively. More full files go into cached payload; more churn."
    
    remote_cache:
      enabled: true
      provider: "gemini"
      ttl_minutes: 60
      keepalive:
        enabled: true
        refresh_when_remaining_minutes_lte: 15
      upload:
        upload_cached_payload: true
        sanitize:
          enabled: false
          redact_patterns: []

    budgets:
      cached_max_chars: 2600000
      cached_target_chars: 1900000

    fidelity:
      rules:
        - name: "stable_core_full_even_if_large"
          when:
            volatile: false
            core_score_gte: 0.60
            file_chars_lte: 400000
          use: "full"
        - name: "massive_reference_skeleton"
          when:
            volatile: false
            file_chars_gte: 400000
          use: "skeleton"
        - name: "default_skeleton"
          when: {}
          use: "skeleton"

    hotset:
      include_targeted_symbol_bodies: true
      targeted_symbol_body_max_chars: 140000
      include_full_for_touched_if_small: true
      full_for_touched_max_chars: 180000

  # ─────────────────────────────────────────────────────────────────────────────
  # PARANOID_MINCLOUD - Minimal cloud exposure
  # ─────────────────────────────────────────────────────────────────────────────
  paranoid_mincloud:
    description: "Minimize cloud exposure. If remote cache used, upload docs/schemas + skeletons only (no full code)."
    
    remote_cache:
      enabled: true
      provider: "gemini"
      ttl_minutes: 45
      keepalive:
        enabled: false
      upload:
        upload_cached_payload: true
        sanitize:
          enabled: true
          redact_patterns:
            - "(?i)api[_-]?key\\s*[:=]\\s*\\S+"
            - "(?i)secret\\s*[:=]\\s*\\S+"
            - "(?i)password\\s*[:=]\\s*\\S+"
            - "(?i)token\\s*[:=]\\s*\\S+"
            - "(?i)credential\\s*[:=]\\s*\\S+"

    assembly:
      cached_payload:
        enabled: true
        include:
          - "project_map"
          - "bedrock_docs"
          - "schemas_and_interfaces"
          - "structural_summaries"
          - "skeletons_only"
      hotset_payload:
        include:
          - "briq"
          - "changed_diffs"
          - "touched_files_full_if_small"

    fidelity:
      rules:
        - name: "force_skeleton_everything"
          when: {}
          use: "skeleton"

  debug_repro:
    description: "Reproducibility + maximum audit. Writes full payload artifacts and detailed decision logs."
    
    remote_cache:
      enabled: false

    logging:
      verbose_decisions: true
      write_full_payload_artifacts: true
      write_inputs_refs: true

    assembly:
      cached_payload:
        enabled: true
        include:
          - "project_map"
          - "bedrock_docs"
          - "stable_core_files_variable_fidelity"
          - "structural_summaries"
          - "public_api_surface"
      hotset_payload:
        include:
          - "briq"
          - "recent_errors"
          - "changed_diffs"
          - "touched_files_full_or_targeted_symbols"

    truncation:
      annotate_truncation: true
      include_reason: true

    fidelity:
      rules:
        - name: "stable_core_full"
          when:
            tier: "stable"
            core_score_gte: 0.65
            volatile: false
            file_chars_lte: 200000
          use: "full"
        - name: "massive_reference_skeleton"
          when:
            volatile: false
            file_chars_gte: 220000
          use: "skeleton"
        - name: "default_skeleton"
          when: {}
          use: "skeleton"

qontext_schema:
  file_path_key: "file_path"
  symbols_key: "symbols"
  deps_key: "dependencies"
  inbound_refs_key: "inbound_refs"
  purpose_key: "purpose"
  last_changed_key: "last_changed"

inspeqtor:
  per_briq:
    max_prompt_chars: 500000
    max_context_files: 40
    max_chars_per_file: 80000
    
    context_filter:
      enabled: true
      neighbor_depth: 1
      include_inbound_refs: true
      fallback_limit: 10
    
    prompt:
      max_code_chars_per_file: 50000
      include_briq_content: true
      include_cycle_goal: false

  meta_review:
    max_prompt_chars: 100000
    max_chars_per_briq_summary: 1500
    
    include:
      - cycle_goal                        # Original tasq.md
      - construqtor_summary               # What was built
      - per_briq_assessments              # Individual briq verdicts
      - per_briq_suggestions              # Suggestions from tactical reviews
    
    exclude:
      - raw_code                          # NO code in meta-review
      - full_architectural_context        # NO .q.yaml files
      - previous_logs                     # NO log context

  output:
    briq_reqap_dir: "reqap.d/cyqle{N}"
    briq_reqap_pattern: "{briq_name}_reqap.md"
    final_reqap: "reqap.d/cyqle{N}_reqap.md"
    embed_briq_reqaps_in_final: true
