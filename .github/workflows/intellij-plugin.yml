name: Build IntelliJ Plugin

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'intellij-plugin/**'
      - '.github/workflows/intellij-plugin.yml'
  pull_request:
    branches: [main]
    paths:
      - 'intellij-plugin/**'
      - '.github/workflows/intellij-plugin.yml'
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    working-directory: intellij-plugin

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v3

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build plugin
        run: ./gradlew clean buildPlugin

      - name: Run tests
        run: ./gradlew test

      - name: Extract version from build.gradle.kts
        id: version
        run: |
          VERSION=$(grep -oP 'version = "\K[^"]+' build.gradle.kts || echo "unknown")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"

      - name: Verify plugin artifact
        run: |
          ls -lh build/distributions/*.zip
          echo "Plugin built successfully"

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: qonqrete-intellij-${{ steps.version.outputs.version }}
          path: intellij-plugin/build/distributions/*.zip
          retention-days: 30

  verify:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        intellij-version: ['2023.3', '2024.1']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Verify plugin compatibility
        run: ./gradlew verifyPlugin
        continue-on-error: true

  release:
    needs: [build, verify]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build release plugin
        run: ./gradlew clean buildPlugin

      - name: Rename artifact for release
        run: |
          TAG="${GITHUB_REF_NAME}"
          cd build/distributions
          for f in *.zip; do
            mv "$f" "qonqrete-intellij-${TAG}.zip"
          done
          ls -lh *.zip

      - name: Generate checksum
        run: |
          TAG="${GITHUB_REF_NAME}"
          cd build/distributions
          sha256sum "qonqrete-intellij-${TAG}.zip" > "qonqrete-intellij-${TAG}-SHA256.txt"
          cat "qonqrete-intellij-${TAG}-SHA256.txt"

      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            intellij-plugin/build/distributions/*.zip
            intellij-plugin/build/distributions/*-SHA256.txt
          generate_release_notes: true

      # JetBrains Marketplace:
      # The FIRST publication must be uploaded manually in JetBrains Marketplace.
      # After that, you can automate publishing by uncommenting the block below
      # and setting these repo secrets:
      # - INTELLIJ_PUBLISH_TOKEN
      # - CERTIFICATE_CHAIN
      # - PRIVATE_KEY
      # - PRIVATE_KEY_PASSWORD
      #
      # - name: Publish to JetBrains Marketplace
      #   run: ./gradlew signPlugin publishPlugin
      #   env:
      #     PUBLISH_TOKEN: ${{ secrets.INTELLIJ_PUBLISH_TOKEN }}
      #     CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
      #     PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
      #     PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
