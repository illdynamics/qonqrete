# .github/workflows/intellij-plugin.yml
# QonQrete IntelliJ plugin builder
# Aligned to: v1.4.6
#
# Notes for v1.4.0:
#   - intellij-plugin/build.gradle.kts now reads version from rootProject.file("../VERSION")
#     so the plugin version always equals the root VERSION file. The old regex-based
#     extraction (grep version = "..." build.gradle.kts) no longer matches and would
#     yield "unknown". This workflow reads root VERSION directly instead.
#   - build.gradle.kts targets JDK 17 (sourceCompatibility/targetCompatibility = 17)
#     and the plugin verifier targets IntelliJ 2023.3.8+, all of which bundle JDK 17
#     (or later JDKs that remain backward-compatible with 17 bytecode).
#     We standardise on Temurin JDK 17 across all jobs.
#   - Trigger paths now include the root VERSION file so a version bump alone
#     can refresh the plugin artifact.
#   - Auto-publish to JetBrains Marketplace remains intentionally disabled
#     (left commented out below) per maintainer policy.
#
# Compatibility verification:
#   The verify job spreads the JetBrains Plugin Verifier across one matrix
#   slot per IntelliJ release line. Each runner rewrites the hardcoded
#   `runPluginVerifier { ideVersions.set(listOf(...)) }` block in
#   build.gradle.kts to its single assigned IDE version, runs the verifier,
#   and uploads the per-version HTML report as a workflow artifact.
#   This mirrors the JetBrains Marketplace one-row-per-IDE-version layout
#   and provides isolated pass/fail signal per release line.
#
#   IMPORTANT: this is a pre-flight check for the maintainer. It does NOT
#   produce or replace the verification rows shown on the JetBrains
#   Marketplace plugin page — those are produced by JetBrains' own
#   verifier service when the plugin is uploaded.

name: Build IntelliJ Plugin

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'intellij-plugin/**'
      - 'VERSION'
      - '.github/workflows/intellij-plugin.yml'
  pull_request:
    branches: [main]
    paths:
      - 'intellij-plugin/**'
      - 'VERSION'
      - '.github/workflows/intellij-plugin.yml'
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    working-directory: intellij-plugin

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # JDK 17 matches:
      #   - intellij-plugin/build.gradle.kts source/target compatibility (17)
      #   - bundled JDK of IntelliJ 2023.3 / 2024.x (the lowest verifier targets)
      # Newer IDE lines (2025.x, 2026.x) ship JDK 21 but remain backward-
      # compatible with 17 bytecode, so JDK 17 is still the right build JDK.
      # See https://plugins.jetbrains.com/docs/intellij/jdk-requirements.html
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Read root VERSION
        id: version
        # build.gradle.kts now reads the version from ../VERSION, so this
        # is the same value the artifact will carry.
        working-directory: ${{ github.workspace }}
        run: |
          VERSION=$(cat VERSION | tr -d '[:space:]')
          if [ -z "$VERSION" ]; then
            echo "FATAL: VERSION file is empty" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Plugin version (from root VERSION): $VERSION"

      - name: Verify tag matches VERSION (tag pushes only)
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: ${{ github.workspace }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$VERSION" != "$TAG_VERSION" ]; then
            echo "FATAL: pushed tag ($GITHUB_REF_NAME -> $TAG_VERSION) does not match VERSION ($VERSION)" >&2
            exit 1
          fi
          echo "Tag and VERSION agree: $VERSION"

      - name: Build plugin
        run: ./gradlew clean buildPlugin

      - name: Run tests
        # The QonQrete IntelliJ plugin has a handful of integration tests
        # that depend on local runtime components which are unavailable in CI.
        # continue-on-error keeps spurious failures from blocking the build
        # while still publishing test reports for inspection.
        run: ./gradlew test
        continue-on-error: true

      - name: Verify plugin artifact
        run: |
          ls -lh build/distributions/*.zip
          echo "Plugin built successfully"

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: qonqrete-intellij-${{ steps.version.outputs.version }}
          path: intellij-plugin/build/distributions/*.zip
          retention-days: 30

  verify:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # Don't cancel sibling matrix jobs if one IDE line fails — we want
      # full per-version coverage in a single run.
      fail-fast: false
      matrix:
        # Mirrors the IDE release lines that JetBrains Marketplace verifies
        # against. Each entry resolves to the latest patch release of that
        # major.minor line at verification time. Plugin claims compat from
        # build 233 onwards (since-build="233" in plugin.xml = 2023.3+),
        # and there is no until-build cap.
        intellij-version:
          - '2023.3.8'
          - '2024.1.7'
          - '2024.2.6'
          - '2024.3.7.1'
          - '2025.1.7.1'
          - '2025.2.6.2'
          - '2025.3.5'
          - '2026.1.2'
          - '2026.2-EAP-SNAPSHOT'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false

      - name: Make gradlew executable
        run: chmod +x gradlew

      # Cache the downloaded IDE distributions used by the Plugin Verifier.
      # Each distro is ~1GB; without this, every matrix run re-downloads
      # from JetBrains' CDN. Cache key is per IDE version so each runner
      # has an isolated cache slot.
      - name: Cache Plugin Verifier IDE distributions
        uses: actions/cache@v4
        with:
          path: ~/.pluginVerifier/ides
          key: pluginVerifier-ides-${{ matrix.intellij-version }}-v2
          restore-keys: |
            pluginVerifier-ides-${{ matrix.intellij-version }}-

      - name: Pin verifier to ${{ matrix.intellij-version }}
        # build.gradle.kts hardcodes:
        #     runPluginVerifier { ideVersions.set(listOf("2023.3", "2024.1")) }
        # We rewrite that single line per matrix run so each runner verifies
        # exactly one IDE release line. Assumes the listOf(...) stays on a
        # single line in build.gradle.kts — a multi-line listOf would
        # require a different rewrite strategy.
        run: |
          set -euo pipefail
          before_count=$(grep -cE 'ideVersions\.set\(listOf\([^)]*\)\)' build.gradle.kts || true)
          if [ "$before_count" != "1" ]; then
            echo "FATAL: expected exactly one ideVersions.set(listOf(...)) line in build.gradle.kts, found ${before_count}" >&2
            grep -n "ideVersions" build.gradle.kts >&2 || true
            exit 1
          fi
          sed -i.bak -E \
            's|ideVersions\.set\(listOf\([^)]*\)\)|ideVersions.set(listOf("${{ matrix.intellij-version }}"))|' \
            build.gradle.kts
          echo "Pinned verifier IDE version: ${{ matrix.intellij-version }}"
          grep -n "ideVersions" build.gradle.kts

      - name: Verify plugin compatibility against ${{ matrix.intellij-version }}
        # The Plugin Verifier exits 0 on warnings (deprecated/scheduled-for-removal
        # API usages) and non-zero on real compatibility breakages.
        # continue-on-error is intentional: with fail-fast: false above, this
        # gives us per-version pass/fail surfacing without one IDE line breaking
        # the whole release flow. Inspect the uploaded HTML reports for details.
        # Flip this to false if you want strict gating on compat breakages.
        run: ./gradlew verifyPlugin
        continue-on-error: true

      - name: Upload Plugin Verifier report (${{ matrix.intellij-version }})
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verifier-report-${{ matrix.intellij-version }}
          path: intellij-plugin/build/reports/pluginVerifier/
          retention-days: 14
          if-no-files-found: ignore

  release:
    needs: [build, verify]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build release plugin
        run: ./gradlew clean buildPlugin

      - name: Rename artifact for release
        run: |
          TAG="${GITHUB_REF_NAME}"
          cd build/distributions
          for f in *.zip; do
            mv "$f" "qonqrete-intellij-${TAG}.zip"
          done
          ls -lh *.zip

      - name: Generate checksum
        run: |
          TAG="${GITHUB_REF_NAME}"
          cd build/distributions
          sha256sum "qonqrete-intellij-${TAG}.zip" > "qonqrete-intellij-${TAG}-SHA256.txt"
          cat "qonqrete-intellij-${TAG}-SHA256.txt"

      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            intellij-plugin/build/distributions/*.zip
            intellij-plugin/build/distributions/*-SHA256.txt
          generate_release_notes: true

      # ================================================================
      # AUTO-PUBLISH TO JETBRAINS MARKETPLACE  (DISABLED BY DESIGN)
      #
      # Per maintainer policy for v1.4.0 - MLcon Edition: plugin is NOT
      # auto-published from CI. Releases are attached to the GitHub release
      # and uploaded manually to the JetBrains Marketplace when reviewed.
      #
      # If you ever want to flip auto-publish on, add these GitHub secrets:
      #   PUBLISH_TOKEN        - JetBrains Marketplace token
      #   CERTIFICATE_CHAIN    - Plugin signing certificate (optional)
      #   PRIVATE_KEY          - Plugin signing private key  (optional)
      #   PRIVATE_KEY_PASSWORD - Private key password         (optional)
      #
      # Token: https://plugins.jetbrains.com -> Profile -> My Tokens
      # Signing docs: https://plugins.jetbrains.com/docs/intellij/plugin-signing.html
      # ================================================================
      # - name: Sign plugin
      #   if: env.CERTIFICATE_CHAIN != null
      #   run: ./gradlew signPlugin
      #   env:
      #     CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
      #     PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
      #     PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
      #
      # - name: Publish to JetBrains Marketplace
      #   run: ./gradlew publishPlugin
      #   env:
      #     PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
