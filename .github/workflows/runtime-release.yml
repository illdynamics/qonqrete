# .github/workflows/runtime-release.yml
# QonQrete runtime release packager
# Aligned to: v1.4.0 - MLcon Edition
#
# v1.4.0 layout notes (vs older snapshots):
#   - entrypoint.sh REMOVED (umask is inlined into the Dockerfile ENTRYPOINT)
#   - Sandboxfile  REMOVED
#   - package.json ADDED (root-level qualifier/qontextor/qompressor Node tooling)
#   - requirements-optional-tree-sitter.txt ADDED (opt-in fallback)
#   - worqspace/tasq.md ADDED (canonical task file)
#   - tests/ ADDED (shipped MLcon-edition test suite)

name: Build Runtime Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  runtime-zip:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Extract version
        id: version
        run: |
          VERSION=$(cat VERSION | tr -d '[:space:]')
          if [ -z "$VERSION" ]; then
            echo "FATAL: VERSION file is empty" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Runtime version: $VERSION"

      - name: Verify tag matches VERSION (tag pushes only)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$VERSION" != "$TAG_VERSION" ]; then
            echo "FATAL: pushed tag ($GITHUB_REF_NAME -> $TAG_VERSION) does not match VERSION ($VERSION)" >&2
            echo "Bump VERSION first, then re-tag." >&2
            exit 1
          fi
          echo "Tag and VERSION agree: $VERSION"

      - name: Package runtime zip
        run: |
          set -euo pipefail
          # The packaging script handles VERSION extraction and exclusions.
          ./tools/package_runtime_release.sh

      - name: Verify zip hygiene
        run: python3 tools/verify_zip_hygiene.py qonqrete-v*.zip
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: qonqrete-runtime-${{ steps.version.outputs.version }}
          path: |
            qonqrete-v*.zip
            qonqrete-v*-SHA256.txt
          retention-days: 30

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            qonqrete-v*.zip
            qonqrete-v*-SHA256.txt
          generate_release_notes: true
