# .github/workflows/vscode-extension.yml
# QonQrete VS Code extension builder
# Aligned to: v1.4.0 - MLcon Edition
#
# Notes for v1.4.0:
#   - vscode-extension/package.json carries its own "version" field (currently 1.4.0).
#     Unlike the IntelliJ plugin, it does NOT read from root VERSION.
#   - On tag pushes we still cross-check that the extension's package.json
#     matches the pushed tag, so a forgotten bump fails loud instead of
#     shipping a wrong-versioned VSIX.
#   - Auto-publish to the VS Code Marketplace and Open VSX remains intentionally
#     disabled (left commented out below) per maintainer policy.

name: Build VS Code Extension

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'vscode-extension/**'
      - '.github/workflows/vscode-extension.yml'
  pull_request:
    branches: [main]
    paths:
      - 'vscode-extension/**'
      - '.github/workflows/vscode-extension.yml'
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    working-directory: vscode-extension

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: vscode-extension/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Compile extension
        run: npm run compile

      - name: Install vsce
        run: npm install -g @vscode/vsce

      - name: Build VSIX
        run: |
          vsce package --no-dependencies
          ls -lh *.vsix

      - name: Extract version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ -z "$VERSION" ] || [ "$VERSION" = "undefined" ]; then
            echo "FATAL: vscode-extension/package.json has no version" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Extension version: $VERSION"

      - name: Verify tag matches package.json version (tag pushes only)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$VERSION" != "$TAG_VERSION" ]; then
            echo "FATAL: pushed tag ($GITHUB_REF_NAME -> $TAG_VERSION) does not match vscode-extension/package.json version ($VERSION)" >&2
            echo "Bump vscode-extension/package.json first, then re-tag." >&2
            exit 1
          fi
          echo "Tag and package.json version agree: $VERSION"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: qonqrete-vscode-${{ steps.version.outputs.version }}
          path: vscode-extension/*.vsix
          retention-days: 30

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: vscode-extension/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Compile extension
        run: npm run compile

      - name: Install vsce
        run: npm install -g @vscode/vsce

      - name: Build VSIX
        run: vsce package --no-dependencies

      - name: Rename artifact
        run: |
          TAG="${GITHUB_REF_NAME}"
          # There should only be one .vsix produced; rename in place.
          for f in *.vsix; do
            mv "$f" "qonqrete-vscode-${TAG}.vsix"
          done
          ls -lh *.vsix

      - name: Generate checksum
        run: |
          TAG="${GITHUB_REF_NAME}"
          sha256sum "qonqrete-vscode-${TAG}.vsix" > "qonqrete-vscode-${TAG}-SHA256.txt"
          cat "qonqrete-vscode-${TAG}-SHA256.txt"

      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            vscode-extension/*.vsix
            vscode-extension/*SHA256.txt
          generate_release_notes: true

      # ================================================================
      # AUTO-PUBLISH TO VS CODE MARKETPLACE  (DISABLED BY DESIGN)
      #
      # Per maintainer policy for v1.4.0 - MLcon Edition: extension is NOT
      # auto-published from CI. Releases are attached to the GitHub release
      # and uploaded manually to the VS Code Marketplace when reviewed.
      #
      # If you ever want to flip auto-publish on, add VSCE_PAT as a GitHub
      # secret and uncomment the publish step.
      #
      # PAT: https://dev.azure.com -> User Settings -> Personal Access Tokens
      # Scope required: "Marketplace (Manage)"
      # ================================================================
      # - name: Publish to VS Code Marketplace
      #   run: vsce publish --no-dependencies -p ${{ secrets.VSCE_PAT }}

      # ================================================================
      # AUTO-PUBLISH TO OPEN VSX REGISTRY  (DISABLED BY DESIGN)
      #
      # Same maintainer policy. To enable, add OVSX_PAT as a GitHub secret.
      #
      # PAT: https://open-vsx.org -> Settings -> Access Tokens
      # ================================================================
      # - name: Publish to Open VSX
      #   run: npx ovsx publish --no-dependencies -p ${{ secrets.OVSX_PAT }}
