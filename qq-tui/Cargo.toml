[package]
name = "qq-tui"
version = "2.0.0"
edition = "2021"
description = "QonQrete-style terminal UI framework for agent sessions"
authors = ["qq-tui"]
license = "MIT"

[lib]
name = "qq_tui"
path = "src/lib.rs"

[[bin]]
name = "qq-tui"
path = "src/main.rs"

[[bin]]
name = "qq-run"
path = "src/bin/qq-run.rs"

[dependencies]
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
thiserror = "2"
libc = "0.2"
unicode-width = "0.2"
strip-ansi-escapes = "0.2"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
directories = "6"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 2
lto = true
codegen-units = 1
