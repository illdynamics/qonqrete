<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16">
  <defs>
    <linearGradient id="rust" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#B8752A"/>
      <stop offset="50%" style="stop-color:#8B5A1B"/>
      <stop offset="100%" style="stop-color:#6B4513"/>
    </linearGradient>
    <radialGradient id="eye" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#DD3333"/>
      <stop offset="60%" style="stop-color:#AA0000"/>
      <stop offset="100%" style="stop-color:#770000"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="0.4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background Q (left) -->
  <circle cx="5.5" cy="6" r="4" fill="none" stroke="url(#rust)" stroke-width="2"/>
  <line x1="6.5" y1="8" x2="9" y2="11" stroke="url(#rust)" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Foreground Q (right, overlapping) -->
  <circle cx="10.5" cy="6" r="4" fill="none" stroke="url(#rust)" stroke-width="2"/>
  <line x1="11.5" y1="8" x2="14" y2="11" stroke="url(#rust)" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Red alarm eye -->
  <circle cx="5.5" cy="6" r="1.5" fill="url(#eye)" filter="url(#glow)"/>
  <circle cx="5.5" cy="6" r="0.5" fill="#FFFFFF" opacity="0.7"/>
</svg>
