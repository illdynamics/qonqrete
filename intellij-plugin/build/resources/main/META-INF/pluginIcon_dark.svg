<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <!-- Main rust orange gradient matching the artwork -->
    <linearGradient id="rustPlate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F5B848"/>
      <stop offset="25%" style="stop-color:#E89830"/>
      <stop offset="50%" style="stop-color:#D47B20"/>
      <stop offset="75%" style="stop-color:#B86818"/>
      <stop offset="100%" style="stop-color:#8B4513"/>
    </linearGradient>
    
    <!-- Darker weathered rust for shadows -->
    <linearGradient id="rustDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#A06015"/>
      <stop offset="100%" style="stop-color:#5C3810"/>
    </linearGradient>
    
    <!-- Highlight gradient for metal shine -->
    <linearGradient id="metalShine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD080"/>
      <stop offset="50%" style="stop-color:#E89830"/>
      <stop offset="100%" style="stop-color:#9A5510"/>
    </linearGradient>
    
    <!-- Crane arm metal -->
    <linearGradient id="craneMetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#C47820"/>
      <stop offset="50%" style="stop-color:#A06015"/>
      <stop offset="100%" style="stop-color:#6B4010"/>
    </linearGradient>
    
    <!-- Red eye glow -->
    <radialGradient id="eyeCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#FFAA66"/>
      <stop offset="30%" style="stop-color:#FF4422"/>
      <stop offset="60%" style="stop-color:#CC1100"/>
      <stop offset="100%" style="stop-color:#880000"/>
    </radialGradient>
    
    <!-- Eye outer glow -->
    <radialGradient id="eyeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#FF3300" stop-opacity="0.8"/>
      <stop offset="100%" style="stop-color:#FF0000" stop-opacity="0"/>
    </radialGradient>
    
    <!-- Glow filter for eye -->
    <filter id="redGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Drop shadow -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    
    <!-- Texture pattern for rust -->
    <pattern id="rustTexture" patternUnits="userSpaceOnUse" width="8" height="8">
      <rect width="8" height="8" fill="#D47B20"/>
      <circle cx="2" cy="2" r="1" fill="#8B4513" opacity="0.3"/>
      <circle cx="6" cy="5" r="1.5" fill="#5C3810" opacity="0.2"/>
      <circle cx="4" cy="7" r="0.8" fill="#A06015" opacity="0.25"/>
    </pattern>
  </defs>
  
  <!-- ========== LEFT Q ========== -->
  <g filter="url(#dropShadow)">
    <!-- Q outer ring - thick plate -->
    <circle cx="85" cy="115" r="50" fill="url(#rustPlate)" stroke="url(#rustDark)" stroke-width="3"/>
    <!-- Q inner cutout -->
    <circle cx="85" cy="115" r="28" fill="#1a1a2e"/>
    <!-- Weathering overlay -->
    <circle cx="85" cy="115" r="50" fill="url(#rustTexture)" opacity="0.3"/>
    <!-- Top highlight arc -->
    <path d="M50 90 Q85 60 120 90" fill="none" stroke="#FFD080" stroke-width="4" opacity="0.4"/>
    
    <!-- Rivets on left Q -->
    <g fill="#5C3810">
      <circle cx="52" cy="80" r="4"/><circle cx="52" cy="80" r="2" fill="#8B4513"/>
      <circle cx="118" cy="80" r="4"/><circle cx="118" cy="80" r="2" fill="#8B4513"/>
      <circle cx="52" cy="150" r="4"/><circle cx="52" cy="150" r="2" fill="#8B4513"/>
      <circle cx="118" cy="150" r="4"/><circle cx="118" cy="150" r="2" fill="#8B4513"/>
      <circle cx="40" cy="115" r="4"/><circle cx="40" cy="115" r="2" fill="#8B4513"/>
      <circle cx="130" cy="115" r="4"/><circle cx="130" cy="115" r="2" fill="#8B4513"/>
      <circle cx="60" cy="68" r="3"/><circle cx="60" cy="68" r="1.5" fill="#8B4513"/>
      <circle cx="110" cy="68" r="3"/><circle cx="110" cy="68" r="1.5" fill="#8B4513"/>
      <circle cx="60" cy="162" r="3"/><circle cx="60" cy="162" r="1.5" fill="#8B4513"/>
      <circle cx="110" cy="162" r="3"/><circle cx="110" cy="162" r="1.5" fill="#8B4513"/>
    </g>
    
    <!-- Q tail - angled plate -->
    <g transform="rotate(45, 115, 165)">
      <rect x="95" y="150" width="50" height="22" rx="3" fill="url(#rustPlate)" stroke="url(#rustDark)" stroke-width="2"/>
      <rect x="95" y="150" width="50" height="22" rx="3" fill="url(#rustTexture)" opacity="0.3"/>
      <!-- Tail rivets -->
      <circle cx="105" cy="161" r="3" fill="#5C3810"/><circle cx="105" cy="161" r="1.5" fill="#8B4513"/>
      <circle cx="135" cy="161" r="3" fill="#5C3810"/><circle cx="135" cy="161" r="1.5" fill="#8B4513"/>
    </g>
  </g>
  
  <!-- ========== RIGHT Q ========== -->
  <g filter="url(#dropShadow)">
    <!-- Q outer ring -->
    <circle cx="165" cy="115" r="50" fill="url(#rustPlate)" stroke="url(#rustDark)" stroke-width="3"/>
    <!-- Q inner cutout -->
    <circle cx="165" cy="115" r="28" fill="#1a1a2e"/>
    <!-- Weathering overlay -->
    <circle cx="165" cy="115" r="50" fill="url(#rustTexture)" opacity="0.3"/>
    <!-- Top highlight arc -->
    <path d="M130 90 Q165 60 200 90" fill="none" stroke="#FFD080" stroke-width="4" opacity="0.4"/>
    
    <!-- Rivets on right Q -->
    <g fill="#5C3810">
      <circle cx="132" cy="80" r="4"/><circle cx="132" cy="80" r="2" fill="#8B4513"/>
      <circle cx="198" cy="80" r="4"/><circle cx="198" cy="80" r="2" fill="#8B4513"/>
      <circle cx="132" cy="150" r="4"/><circle cx="132" cy="150" r="2" fill="#8B4513"/>
      <circle cx="198" cy="150" r="4"/><circle cx="198" cy="150" r="2" fill="#8B4513"/>
      <circle cx="120" cy="115" r="4"/><circle cx="120" cy="115" r="2" fill="#8B4513"/>
      <circle cx="210" cy="115" r="4"/><circle cx="210" cy="115" r="2" fill="#8B4513"/>
      <circle cx="140" cy="68" r="3"/><circle cx="140" cy="68" r="1.5" fill="#8B4513"/>
      <circle cx="190" cy="68" r="3"/><circle cx="190" cy="68" r="1.5" fill="#8B4513"/>
      <circle cx="140" cy="162" r="3"/><circle cx="140" cy="162" r="1.5" fill="#8B4513"/>
      <circle cx="190" cy="162" r="3"/><circle cx="190" cy="162" r="1.5" fill="#8B4513"/>
    </g>
    
    <!-- Q tail -->
    <g transform="rotate(45, 195, 165)">
      <rect x="175" y="150" width="50" height="22" rx="3" fill="url(#rustPlate)" stroke="url(#rustDark)" stroke-width="2"/>
      <rect x="175" y="150" width="50" height="22" rx="3" fill="url(#rustTexture)" opacity="0.3"/>
      <circle cx="185" cy="161" r="3" fill="#5C3810"/><circle cx="185" cy="161" r="1.5" fill="#8B4513"/>
      <circle cx="215" cy="161" r="3" fill="#5C3810"/><circle cx="215" cy="161" r="1.5" fill="#8B4513"/>
    </g>
  </g>
  
  <!-- ========== CONSTRUCTION CRANE CLAW ========== -->
  <g filter="url(#dropShadow)">
    <!-- Main crane arm from top right -->
    <path d="M240 5 L200 25 L175 50" stroke="url(#craneMetal)" stroke-width="10" fill="none" stroke-linecap="round"/>
    <!-- Crane lattice structure -->
    <path d="M235 10 L210 20 M225 8 L205 28 M215 12 L195 35" stroke="#8B4513" stroke-width="2" fill="none"/>
    <!-- Crane arm highlight -->
    <path d="M238 7 L202 26" stroke="#FFD080" stroke-width="2" fill="none" opacity="0.5"/>
    
    <!-- Crane pivot joint -->
    <circle cx="175" cy="50" r="10" fill="url(#craneMetal)" stroke="#5C3810" stroke-width="2"/>
    <circle cx="175" cy="50" r="5" fill="#3D2510"/>
    
    <!-- Left claw arm -->
    <path d="M175 50 Q140 65 100 75 Q80 85 70 100" stroke="url(#craneMetal)" stroke-width="8" fill="none" stroke-linecap="round"/>
    <path d="M70 100 Q55 115 50 130" stroke="#6B4010" stroke-width="6" fill="none" stroke-linecap="round"/>
    <!-- Left claw tip (sharp) -->
    <path d="M50 130 L42 145 L55 138 Z" fill="#5C3810"/>
    
    <!-- Right claw arm -->  
    <path d="M175 50 Q190 70 195 90 Q198 105 195 115" stroke="url(#craneMetal)" stroke-width="8" fill="none" stroke-linecap="round"/>
    <path d="M195 115 Q192 130 188 140" stroke="#6B4010" stroke-width="6" fill="none" stroke-linecap="round"/>
    <!-- Right claw tip -->
    <path d="M188 140 L195 155 L180 148 Z" fill="#5C3810"/>
    
    <!-- Claw joints -->
    <circle cx="100" cy="75" r="6" fill="#5C3810"/><circle cx="100" cy="75" r="3" fill="#8B4513"/>
    <circle cx="70" cy="100" r="5" fill="#5C3810"/><circle cx="70" cy="100" r="2.5" fill="#8B4513"/>
    <circle cx="195" cy="90" r="6" fill="#5C3810"/><circle cx="195" cy="90" r="3" fill="#8B4513"/>
    <circle cx="195" cy="115" r="5" fill="#5C3810"/><circle cx="195" cy="115" r="2.5" fill="#8B4513"/>
    
    <!-- Chain links hanging -->
    <g stroke="#8B4513" stroke-width="2" fill="none">
      <ellipse cx="220" cy="35" rx="4" ry="6"/>
      <ellipse cx="220" cy="45" rx="4" ry="6"/>
      <ellipse cx="220" cy="55" rx="4" ry="6"/>
    </g>
  </g>
  
  <!-- ========== RECTANGULAR SQUID EYE ========== -->
  <g filter="url(#redGlow)">
    <!-- Outer glow -->
    <rect x="60" y="95" width="50" height="40" rx="6" fill="url(#eyeGlow)"/>
    
    <!-- Eye housing - rectangular like the squid -->
    <rect x="65" y="100" width="40" height="30" rx="4" fill="#2A0505" stroke="#550000" stroke-width="2"/>
    
    <!-- Inner eye frame -->
    <rect x="70" y="105" width="30" height="20" rx="3" fill="#1A0000" stroke="#440000" stroke-width="1"/>
    
    <!-- Eye core glow -->
    <ellipse cx="85" cy="115" rx="12" ry="8" fill="url(#eyeCore)"/>
    
    <!-- Eye inner bright center -->
    <ellipse cx="85" cy="115" rx="6" ry="4" fill="#FF6644"/>
    
    <!-- Eye highlight -->
    <ellipse cx="80" cy="111" rx="4" ry="2.5" fill="#FFFFFF" opacity="0.7"/>
    
    <!-- Secondary small highlight -->
    <circle cx="92" cy="118" r="1.5" fill="#FFAA88" opacity="0.5"/>
  </g>
</svg>
